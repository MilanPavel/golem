[project]
name = "golem-workspace"
version = "0.0.0"
description = "Workspace root for the golem daemon, protocol, and TUI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/protocol", "packages/daemon"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pyright>=1.1.400",
  "ruff>=0.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/protocol", "packages/daemon"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages"]
exclude = [".venv", "**/node_modules", "packages/protocol/gen"]
venvPath = "."
venv = ".venv"
extraPaths = ["packages/daemon/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/protocol/tests", "packages/daemon/tests"]
pythonpath = ["packages/daemon/tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
