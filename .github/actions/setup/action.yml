name: setup
description: Install just, uv, pnpm, Node, and bun, then sync the Python and Node packages.

runs:
  using: composite
  steps:
    # A pinned version, downloaded with the job's token. just's install script
    # asks the GitHub API anonymously, which shared runners get refused (403).
    - name: Install just
      uses: extractions/setup-just@v4
      with:
        just-version: "1.58.0"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.11.31"
        enable-cache: true

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: pnpm

    # `golem` from a checkout runs on bun, so the tests need it too, and
    # `just dist` compiles with it.
    - name: Install bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.10"

    - name: Sync Python
      shell: bash
      run: uv sync --all-packages --frozen

    - name: Install Node dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
