name: setup
description: Install just, uv, pnpm, Node, and optionally bun, then sync the Python and Node packages.

inputs:
  bun:
    description: Also install bun, which `just dist` needs.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install just
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.11.31"
        enable-cache: true

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm

    - name: Install bun
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.10"

    - name: Sync Python
      shell: bash
      run: uv sync --all-packages --frozen

    - name: Install Node dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
