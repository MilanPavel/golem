name: release

# A version tag builds, signs, and smoke-tests golem, and uploads the archive
# and its checksum to a draft release, with the tag's CHANGELOG.md section as
# its notes (`just release`, then `just tag`). A fresh runner downloads that draft,
# checks it with no build tools installed, and only then publishes it. A stable
# version then opens a pull request on the Homebrew tap, <owner>/homebrew-golem.
#
# Needs the secrets MACOS_SIGN_P12_BASE64 and MACOS_SIGN_P12_PASSWORD and the
# variable MACOS_SIGN_IDENTITY (the certificate's SHA-1).
# scripts/make_signing_cert.sh makes them. The tap needs the secret
# HOMEBREW_TAP_TOKEN (docs/sre.md, section 10).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag is the version
        run: |
          version=$(sh scripts/version.sh)
          if [ "$version" != "${TAG#v}" ]; then
            echo "scripts/version.sh says $version, the tag is $TAG" >&2
            exit 1
          fi

      # `just release` wrote this section and `just tag` checked it. A tag pushed
      # by hand without one stops here, before anything is built.
      - name: The changelog has this version
        run: sh scripts/changelog.sh notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - uses: ./.github/actions/setup

      - name: Check
        run: just check

      - name: Import the signing certificate
        env:
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -eu
          missing=""
          [ -n "$MACOS_SIGN_P12_BASE64" ] || missing="$missing the secret MACOS_SIGN_P12_BASE64;"
          [ -n "$MACOS_SIGN_P12_PASSWORD" ] || missing="$missing the secret MACOS_SIGN_P12_PASSWORD;"
          [ -n "$MACOS_SIGN_IDENTITY" ] || missing="$missing the variable (not secret) MACOS_SIGN_IDENTITY;"
          if [ -n "$missing" ]; then
            echo "a release must be signed, and the repository has no$missing see docs/sre.md, section 5" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/golem-signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$MACOS_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # codesign finds an identity only in the search list, even with --keychain.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "GOLEM_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "GOLEM_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign, and smoke
        run: |
          set -euo pipefail
          tree=$(just dist | tail -n 1)
          just check-signature "$tree" --identity-hash "$GOLEM_SIGN_IDENTITY"
          just smoke-dist "$tree"
          archive=$(just package "$tree" | tail -n 1)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload to a draft release
        run: |
          set -eu
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "$state" in
            missing)
              prerelease=""
              case "$TAG" in *-*) prerelease="--prerelease" ;; esac
              gh release create "$TAG" --draft --verify-tag $prerelease \
                --title "golem ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" \
                "$ARCHIVE" "$ARCHIVE.sha256"
              ;;
            true)
              gh release upload "$TAG" --clobber "$ARCHIVE" "$ARCHIVE.sha256"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
              ;;
            *)
              echo "release $TAG is already published; tag a new version" >&2
              exit 1
              ;;
          esac

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${GOLEM_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$GOLEM_SIGN_KEYCHAIN" || true
          fi

  verify:
    # A fresh runner with no uv, pnpm, or bun: only what a user's Mac has.
    needs: build
    runs-on: macos-14
    permissions:
      # A draft release is visible only with write access.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/smoke_dist.py
            scripts/sign_dist.py
            packages/protocol/golem_protocol/version.py
          sparse-checkout-cone-mode: false

      - name: Download the draft release
        run: gh release download "$TAG" --pattern 'golem-*.tar.gz*' --dir "$RUNNER_TEMP/release"

      - name: Check the archive
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/release"
          shasum -a 256 -c ./*.sha256
          mkdir unpacked
          tar -xzf ./*.tar.gz -C unpacked
          tree=$(ls -d "$PWD"/unpacked/golem-*)
          echo "TREE=$tree" >> "$GITHUB_ENV"
          /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/sign_dist.py" check "$tree" --identity-hash "$MACOS_SIGN_IDENTITY"
          "$tree/bin/golem" --version | grep -qx "golem ${TAG#v}"

      - name: Smoke the archive
        run: /usr/bin/python3 scripts/smoke_dist.py "$TREE"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  tap:
    # Homebrew installs whatever the formula names, so prereleases stay off it.
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    env:
      TAP: ${{ github.repository_owner }}/homebrew-golem
    steps:
      - name: The tap token is set
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "the release is published, but the tap needs the HOMEBREW_TAP_TOKEN secret" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/render_formula.sh
            packaging/homebrew
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render the formula
        run: |
          set -eu
          sha256=$(gh release download "$TAG" --pattern 'golem-*.tar.gz.sha256' --output - | awk '{print $1}')
          sh scripts/render_formula.sh "${TAG#v}" "$sha256" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/golem.rb"

      - name: Open a pull request on the tap
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_REPO: ${{ env.TAP }}
        run: |
          set -eu
          version=${TAG#v}
          branch="golem-$version"
          git switch -c "$branch"
          mkdir -p Formula
          cp "$RUNNER_TEMP/golem.rb" Formula/golem.rb
          cp -R "$GITHUB_WORKSPACE/packaging/homebrew/tap/." .
          git add -A
          if git diff --cached --quiet; then
            echo "the tap already has golem $version"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "golem $version"
          git push --force origin "$branch"
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null || true)" = OPEN ]; then
            echo "updated the open pull request for golem $version"
          else
            gh pr create --head "$branch" --title "golem $version" \
              --body "golem $version, from https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG. Merge when the test workflow passes."
          fi
