name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check
        run: just check

  dist:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build and smoke
        run: just dist && just check-signature && just smoke-dist
