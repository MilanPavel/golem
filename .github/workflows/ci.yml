name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `just check` runs these parts one after the other. Here each is a job, so they run side by side.
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Generated files, lint, typecheck, docs
        run: just check-gen && just lint && just typecheck && just docs-build

  test-py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Python tests
        run: just test-py

  test-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: TypeScript tests
        run: just test-js

  test-web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Web tests
        run: just test-web ${{ matrix.shard }}/4

  # The one check the ruleset of main requires: green only when every part above is.
  check:
    if: always()
    needs: [static, test-py, test-js, test-web]
    runs-on: ubuntu-24.04
    steps:
      - name: Every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'results: %s\n' "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  dist:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build and smoke
        run: just dist && just check-signature && just smoke-dist
