name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `just check` runs these parts one after the other. Here each is a job, so they run side by side.
# The generated-files check and the docs build are parts of the required check, so they always run;
# a filter step skips the work on a pull request that leaves their inputs alone. A push to main runs
# everything.
jobs:
  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Does this change touch the protocol or the generators?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(packages/protocol/|apps/apple/GolemKit/Sources/GolemKit/Generated/|justfile$|pyproject\.toml$|uv\.lock$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The generated files cannot have changed, so they are not checked."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup
        if: steps.filter.outputs.run == 'true'

      - name: Generated files
        if: steps.filter.outputs.run == 'true'
        run: just check-gen

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint
        run: just lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: just typecheck

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Does this change touch the docs or what they build from?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(docs/|packages/web/|packages/view/|packages/client/|packages/protocol/gen/|packages/gateway/|packages/tui/src/logo\.ts$|README\.md$|CONTRIBUTING\.md$|justfile$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The docs and the web gallery are untouched, so the site is not built."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup
        if: steps.filter.outputs.run == 'true'

      - name: Build the docs
        if: steps.filter.outputs.run == 'true'
        run: just docs-build

  test-py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Python tests
        run: just test-py

  test-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: TypeScript tests
        run: just test-js

  test-web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Web tests
        run: just test-web ${{ matrix.shard }}/4

  # Builds the relay's image and checks that it answers. It is a part of the required check, so it
  # always runs; the filter step skips the build on a pull request that leaves the relay alone.
  relay-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Does this change touch the relay?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(packages/relay/|packages/gateway/src/secret\.ts$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The relay is untouched, so the image is not built."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the image
        if: steps.filter.outputs.run == 'true'
        run: docker build -f packages/relay/Dockerfile -t golem-relay .

      - name: Run it and check /healthz
        if: steps.filter.outputs.run == 'true'
        run: |
          docker run -d -p 8080:8080 -e RELAY_HOST=localhost --name relay golem-relay
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "healthz did not answer in 20 s"
          exit 1

      - name: Wait for the container's own health check
        if: steps.filter.outputs.run == 'true'
        run: |
          for _ in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' relay)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 1
          done
          exit 1

      - name: Show the relay's log
        if: failure() && steps.filter.outputs.run == 'true'
        run: docker logs relay

  # The one check the ruleset of main requires: green only when every part above is.
  # Runs GolemKit's tests and, once the app's project file exists, builds the app for the simulator.
  # It is a part of the required check, so it always runs; the filter step skips the work on a pull
  # request that leaves the app and its protocol types alone.
  swift:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Does this change touch the app?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(apps/apple/|packages/protocol/gen/|packages/view/fixtures/golden/|packages/protocol/vectors/|packages/relay/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The app is untouched, so Swift is not built."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Swift version
        if: steps.filter.outputs.run == 'true'
        run: |
          xcode-select -p
          swift --version

      # GolemKit's connection tests start the real relay (packages/relay), which runs on bun
      # and needs no other package.
      - name: Install bun
        if: steps.filter.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Test GolemKit
        if: steps.filter.outputs.run == 'true'
        timeout-minutes: 10
        working-directory: apps/apple/GolemKit
        run: swift test

      - name: Build the app for the simulator
        if: steps.filter.outputs.run == 'true'
        run: |
          if [ -f apps/apple/project.yml ]; then
            brew install xcodegen
            cd apps/apple
            xcodegen
            xcodebuild build -project Golem.xcodeproj -scheme Golem \
              -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
          else
            echo "apps/apple/project.yml does not exist yet, so there is no app to build."
          fi

  check:
    if: always()
    needs: [gen, lint, typecheck, docs, test-py, test-js, test-web, relay-image, swift]
    runs-on: ubuntu-24.04
    steps:
      - name: Every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'results: %s\n' "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  dist:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build and smoke
        run: just dist && just check-signature && just smoke-dist
