<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 514" role="img" aria-label="Three ways a run stops early in golem, and the one end they share. Ctrl-C sends run.cancel: seq 125 is message.completed with interrupted true and the text so far, and seq 126 is run.cancelled with the reason user. golem daemon stop drains every run the same way, with the reason shutdown. After kill -9 nothing runs for 12 seconds, and at the next start recovery writes seq 865, the same interrupted message, and seq 866, run.failed. In every case the checkpoint gets the same partial text, so go on continues it.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="514" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">THREE EARLY ENDS IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">one shape</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a cancel, a shutdown, a crash</text>
<text class="mono label" x="30" y="146">HOW IT STOPPED</text><text class="mono label" x="190" y="146">THE ANSWER STREAMS</text><text class="mono label" x="520" y="146">WHAT THE LOG GETS</text><text class="mono" x="30" y="194" font-size="13">Ctrl-C</text><text class="small faint" x="30" y="212">run.cancel</text><rect x="190" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="205" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="220" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="235" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="250" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="265" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="280" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="295" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="310" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="325" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="340" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="355" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="370" y="184" width="9" height="12" rx="1" fill="var(--line)"/><rect x="385" y="184" width="9" height="12" rx="1" fill="var(--line)"/><path class="wire" d="M400 176 V204" style="stroke:var(--clay);stroke-width:2"/><path class="wire" d="M408 190 H515"/><path class="head" d="M509 186 L516 190 L509 194 Z"/><rect class="box" x="520" y="160" width="330" height="62" rx="2"/><text class="mono small " x="534" y="180">seq 125 message.completed</text><text class="mono small faint" x="534" y="196">interrupted: true, the text so far</text><text class="mono small clay" x="534" y="212">seq 126 run.cancelled · user</text><text class="mono" x="30" y="294" font-size="13">golem daemon stop</text><text class="small faint" x="30" y="312">SIGTERM: drain</text><rect x="190" y="284" width="9" height="12" rx="1" fill="var(--line)"/><rect x=