<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" role="img" aria-label="The router as a gauge from local to hosted. Four requests in turn: rename a variable and read a private receipt go to a small local model for nothing, summarize a long log goes to a bigger local model, and plan a migration steps up to a hosted model for two cents. A bar shows the day's spend against a one dollar budget.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="496" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">THE CORE</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">cheap first</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">step up only when it pays off</text>
<text class="mono label" x="30" y="140" text-anchor="start">REQUESTS</text><text class="mono label" x="440" y="140" text-anchor="middle">THE ROUTER</text><text class="mono label" x="620" y="140" text-anchor="start">WHERE IT RAN</text><rect class="box" x="30" y="220" width="260" height="120" rx="6"/><path d="M320 300 A120 120 0 0 1 560 300" fill="none" stroke="var(--line)" stroke-width="10"/><path d="M486 189 A120 120 0 0 1 560 300" fill="none" stroke="var(--clay)" stroke-width="10"/><text class="mono small muted" x="314" y="326" text-anchor="middle">local</text><text class="mono small muted" x="566" y="326" text-anchor="middle">hosted</text><text class="small faint" x="440" y="340" text-anchor="middle">cheapest model that can do it</text><circle cx="440" cy="300" r="8" fill="var(--ink)"/><rect class="box" x="620" y="220" width="230" height="120" rx="6"/><text class="mono label" x="30" y="392" text-anchor="start">SPENT TODAY</text><rect x="30" y="404" width="820" height="10" rx="5" fill="var(--sunken)"/><text class="mono small faint" x="850" y="392" text-anchor="end">budget $1.00</text>
