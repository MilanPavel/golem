<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-label="A line from the keys to the screen. You press Enter. applyComposer in App decides: a line that starts with a slash is a local command, the rest is text. App calls sendMessage, and the client sends message.send. The daemon answers only with the run id. Your line appears when message.completed comes back. Then 192 message.delta events arrive, and a 16 millisecond batcher turns them into 158 screen updates. message.completed and run.completed end the reply.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="520" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">A LINE, IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">Enter</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">from the keys to the screen</text>
<rect class="box" x="20" y="126" width="120" height="32" rx="2"/><text class="mono" x="80" y="147" font-size="14" text-anchor="middle">you</text><path class="edge" d="M80 158 V490"/><rect class="box" x="240" y="126" width="120" height="32" rx="2"/><text class="mono" x="300" y="147" font-size="14" text-anchor="middle">App</text><path class="edge" d="M300 158 V490"/><rect class="box" x="460" y="126" width="120" height="32" rx="2"/><text class="mono" x="520" y="147" font-size="14" text-anchor="middle">client</text><path class="edge" d="M520 158 V490"/><rect class="box" x="700" y="126" width="120" height="32" rx="2"/><text class="mono" x="760" y="147" font-size="14" text-anchor="middle">daemon</text><path class="edge" d="M760 158 V490"/><path class="wire" d="M80 186 H299"/><path class="head" d="M293 182 L300 186 L293 190 Z"/><text class="mono small" x="94" y="179">Enter</text><path class="wire" d="M300 252 H519"/><path class="head" d="M513 248 L520 252 L513 256 Z"/><text class="mono small" x="314" y="245">sendMessage</text><path class="wire" d="M520 282 H759"/><path class="head" d="M753 278 L760 282 L753 286 Z"/><text class="mono small" x="534" y="275">message.send</text><path class="wire back" d="M760 312 H521"/><path class="head" d="M527 308 L520 312 L527 316 Z"/><text class="mono small" x="534" y="305">result: run_id, no text yet</text><path class="wire back" d="M760 344 H301"/><path class="head" d="M307 340 L300 344 L307 348 Z"/><text class="mono small" x="314" y="337">message.completed: your line</text><path class="wire back" d="M760 372 H301"/><path class="head" d="M307 368 L300 372 L307 376 Z"/><text class="mono small" x="314" y="365">message.delta × 192</text><path class="wire back" d="M760 462 H301"/><path class="head" d="M307 458 L300 462 L307 466 Z"/><text class="mono small" x="314" y="455">message.completed, run.completed</text><rect class="box" x="236" y="200" width="128" height="26" rx="2" style="fill:var(--soft)"/><text class="mono small" x="248" y="217">applyComposer</text><text class="small faint" x="372" y="217">/ is a command, the rest is text</text><rect class="box" x="236" y="386" width="128" height="44" rx="2" style="fill:var(--soft)"/><text class="mono small" x="248" y="404">16 ms</text><text class="small faint" x="248" y="421">158 updates</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M80 186 H300" keyTimes="0;0.0300;0.0800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.0800;0.0920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="232" y="196" width="136" height="34" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1080;0.1200;0.1800;0.1920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M300 252 H520" keyTimes="0;0.1900;0.2400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1780;0.1900;0.2400;0.2520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M520 282 H760" keyTimes="0;0.2800;0.3300;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2680;0.2800;0.3300;0.3420;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M760 312 H520" keyTimes="0;0.3700;0.4200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3580;0.3700;0.4200;0.4320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M760 344 H300" keyTimes="0;0.4600;0.5300;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4480;0.4600;0.5300;0.5420;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M760 372 H300" keyTimes="0;0.5700;0.6400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5580;0.5700;0.6400;0.6520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M760 462 H300" keyTimes="0;0.6800;0.7500;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6680;0.6800;0.7500;0.7620;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="232" y="382" width="136" height="52" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6080;0.6200;0.7800;0.7920;1.0000" values="0;0;1;1;0;0"/></rect></g>
</svg>
