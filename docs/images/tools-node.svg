<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" role="img" aria-label="golem's tools node: for a reply's tool calls it first decides about every call (is the tool here, a preview of a file change, and the rules: allow, ask, or deny), and only then runs them one by one. Each result goes to the model as a ToolMessage and to the screen as tool.completed. Long output also goes to an artifact, and a todo list to graph state.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="372" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE REPLY IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">2 passes</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">decide about every call, then run them</text>
<rect x="24" y="134" width="544" height="182" rx="3" fill="var(--soft)"/>
<rect class="box" x="44" y="168" width="232" height="128" rx="2"/><text class="mono label" x="60" y="192">1 · DECIDE, EVERY CALL</text><text x="60" y="222" font-size="14">is it a tool here?</text><text x="60" y="246" font-size="14">preview a file change</text><text x="60" y="270" font-size="14">rules: allow · ask · deny</text><rect class="box" x="316" y="168" width="232" height="128" rx="2"/><text class="mono label" x="332" y="192">2 · RUN, ONE BY ONE</text><text x="332" y="222" font-size="14">check the arguments</text><text x="332" y="246" font-size="14">run, stream its output</text><text x="332" y="270" font-size="14">a result, or an error</text><path class="wire" d="M160 124 V165"/><path class="head" d="M156 159 L160 166 L164 159 Z"/><text class="mono label" x="160" y="116" text-anchor="middle">A REPLY'S TOOL CALLS</text><path class="wire" d="M276 232 H312"/><path class="head" d="M306 228 L313 232 L306 236 Z"/><path class="wire" d="M548 232 H600 M600 162 V324"/><path class="wire" d="M600 162 H626"/><path class="head" d="M622 158 L629 162 L622 166 Z"/><path class="wire" d="M600 216 H626"/><path class="head" d="M622 212 L629 216 L622 220 Z"/><path class="wire" d="M600 270 H626"/><path class="head" d="M622 266 L629 270 L622 274 Z"/><path class="wire" d="M600 324 H626"/><path class="head" d="M622 320 L629 324 L622 328 Z"/><path class="wire back" d="M160 296 V340"/><text class="small muted" x="172" y="336">ask: the run pauses here for you (chapter 4)</text><rect class="box" x="632" y="140" width="218" height="44" rx="2"/><text class="mono" x="646" y="159" font-size="13">ToolMessage</text><text class="small faint" x="646" y="176">the model reads it</text><rect class="box" x="632" y="194" width="218" height="44" rx="2"/><text class="mono" x="646" y="213" font-size="13">tool.completed</text><text class="small faint" x="646" y="230">the screen sees it</text><rect class="box" x="632" y="248" width="218" height="44" rx="2"/><text class="mono" x="646" y="267" font-size="13">artifacts</text><text class="small faint" x="646" y="284">if over 20 000 chars</text><rect class="box" x="632" y="302" width="218" height="44" rx="2"/><text class="mono" x="646" y="321" font-size="13">todos</text><text class="small faint" x="646" y="338">graph state, if allowed</text>
