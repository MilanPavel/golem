<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 466" role="img" aria-label="Progressive disclosure in three levels. The index, one line per skill, goes into every call. When the model picks release-notes, its body is read. The body says to read references/style.md, so that one file is read, and scripts/changelog.sh never is.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="466" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">3 levels</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">each read only when it is needed</text>
<text class="mono label" x="30" y="146">1 · INDEX</text><text class="mono label" x="330" y="146">2 · BODY</text><text class="mono label" x="620" y="146">3 · FILES</text><rect class="box" x="30" y="160" width="250" height="32" rx="2"/><text class="mono small" x="42" y="180">release-notes</text><text class="small faint" x="268" y="180" text-anchor="end">write release notes</text><rect class="box" x="30" y="200" width="250" height="32" rx="2"/><text class="mono small" x="42" y="220">pdf-forms</text><text class="small faint" x="268" y="220" text-anchor="end">fill and read PDF forms</text><rect class="box" x="30" y="240" width="250" height="32" rx="2"/><text class="mono small" x="42" y="260">terse</text><text class="small faint" x="268" y="260" text-anchor="end">short answers</text><rect class="box" x="30" y="280" width="250" height="32" rx="2"/><text class="mono small" x="42" y="300">review</text><text class="small faint" x="268" y="300" text-anchor="end">review a diff</text><rect class="box" x="30" y="320" width="250" height="32" rx="2"/><text class="mono small" x="42" y="340">deploy</text><text class="small faint" x="268" y="340" text-anchor="end">ship to staging</text><rect class="box" x="330" y="160" width="240" height="152" rx="2"/><text class="mono small clay" x="344" y="188"># Write release notes</text><text class="mono small" x="344" y="218">1. Read references/style.md</text><text class="mono small" x="344" y="248">2. Read CHANGES.txt</text><text class="mono small" x="344" y="278">3. One line per change</text><path class="edge" d="M280 176 H330"/><path class="edge" d="M570 233 H620"/><rect class="box" x="620" y="200" width="230" height="52" rx="2"/><text class="mono small" x="634" y="222">references/style.md</text><text class="small faint" x="634" y="240">read: the body says so</text><rect class="box" x="620" y="270" width="230" height="52" rx="2"/><text class="mono small" x="634" y="292">scripts/changelog.sh</text><text class="small faint" x="634" y="310">never read this time</text><text class="small muted" x="30" y="380">a line per skill, in every call</text><text class="small muted" x="330" y="380">the whole body, once it is used</text><text class="small muted" x="620" y="380">only what the body asks for</text>
<text class="small muted" x="30" y="440">Fifty skills cost fifty short lines. Only the one in use costs its whole body.</text>
<g class="anim"><rect class="lit" x="26" y="156" width="258" height="40" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0480;0.0600;0.9200;0.9320;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="30" y="404">→ the model picks release-notes<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0880;0.1000;0.3000;0.3120;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 176 H328" keyTimes="0;0.2200;0.2800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2080;0.2200;0.2800;0.2920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="326" y="156" width="248" height="160" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2680;0.2800;0.9200;0.9320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="336" y="212" width="228" height="28" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4080;0.4200;0.5600;0.5720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M570 233 H618" keyTimes="0;0.5200;0.5800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5080;0.5200;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="616" y="196" width="238" height="60" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5680;0.5800;0.9200;0.9320;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="620" y="404">→ one file read, one never<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6080;0.6200;0.9200;0.9320;1.0000" values="0;0;1;1;0;0"/></text></g>
</svg>
