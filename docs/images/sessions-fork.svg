ss="box" x="384" y="340" width="124" height="62" rx="2" style="stroke:var(--clay);stroke-width:1.4"/><text class="mono small faint" x="394" y="360">#3</text><text x="394" y="378" font-size="13">golem</text><text class="small muted" x="394" y="394">…shaped like</text><rect class="box" x="520" y="340" width="124" height="62" rx="2"/><text class="mono small faint" x="530" y="360">#4</text><text x="530" y="378" font-size="13">you</text><text class="small muted" x="530" y="394">what was it called?</text><rect class="box" x="656" y="340" width="194" height="62" rx="2"/><text class="mono small faint" x="666" y="360">#168</text><text x="666" y="378" font-size="13">golem</text><text class="small muted" x="666" y="394">Terrafol, "shaped like"</text><rect class="box" x="30" y="340" width="206" height="62" rx="2"/><text class="mono small faint" x="40" y="360">#1 session.created</text><text class="mono small " x="40" y="376">forked_from: m_fd51…</text><text class="small muted" x="40" y="394">logged before the copies</text><path class="wire" d="M92 222 V300 H310 V337"/><path class="head" d="M306 331 L310 338 L314 331 Z"/><path class="wire" d="M228 222 V280 H446 V337"/><path class="head" d="M442 331 L446 338 L450 331 Z"/><text class="small faint" x="470" y="304">copied: a new seq, the same run_id</text><rect class="dot" x="30" y="438" width="6" height="6"/><text x="46" y="446" font-size="14" class="muted">The model's side: the checkpoint whose last message is m_fd51…</text><rect class="dot" x="30" y="460" width="6" height="6"/><text x="46" y="468" font-size="14" class="muted">The screen's side: each message.completed up to and including it</text>
