<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-label="golem's screen, top to bottom, in three moments. Idle: the header, the transcript, the composer, and the status line. While a reply streams, the meter takes one row, writing with the characters and seconds, and the composer shrinks to an ellipsis. While a tool call waits, the approval band takes rows above the composer and the meter says waiting for your approval. The transcript gets every row the others leave. A 24 by 80 terminal gives a frame 79 columns wide and 15 rows of chat.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="500" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">THE SCREEN, IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">bands</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a band with nothing to show takes no rows</text>
<rect x="222" y="122" width="436" height="356" rx="6" fill="var(--sunken)"/><rect class="box" x="230" y="130" width="420" height="52" rx="1"/><text class="mono small" x="242" y="160.0">█ golem  0.8.0 · qwen3.5:4b · ~/notes</text><text class="small faint" x="640" y="160.0" text-anchor="end">header</text><rect class="box" x="230" y="186" width="420" height="220" rx="1"/><text class="mono small" x="242" y="208">you  Tell a short story</text><text class="mono small" x="242" y="232">golem Once, a golem of river clay…</text><text class="small faint" x="640" y="208" text-anchor="end">transcript</text><text class="small faint" x="640" y="226" text-anchor="end">gets what is left</text><rect class="box" x="230" y="444" width="420" height="22" rx="1"/><text class="mono small faint" x="242" y="459.0">connected · a story · qwen3.5:4b · 2 messages</text><text class="small faint" x="640" y="459.0" text-anchor="end">status</text><rect class="box" x="230" y="410" width="420" height="30" rx="1"/><text class="mono small" x="242" y="429.0">❯ Type a message.</text><text class="small faint" x="640" y="429.0" text-anchor="end">composer</text><rect x="20" y="180" width="190" height="80" fill="var(--bg)"/><text class="mono clay" x="30" y="200" font-size="14">idle</text><text class="small faint" x="30" y="222">nothing to show:</text><text class="small faint" x="30" y="240">no meter, no band</text><text class="small faint" x="676" y="200">24 × 80 terminal:</text><text class="small faint" x="676" y="218">a frame 79 wide,</text><text class="small faint" x="676" y="236">and 15 rows of chat</text><text class="small faint" x="676" y="290">short window:</text><text class="small faint" x="676" y="308">bands give rows back</text><text class="small faint" x="676" y="326">until the chat has one</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3280;0.3400;0.6400;0.6520;1.0000" values="0;0;1;1;0;0"/><rect x="220" y="120" width="440" height="360" fill="var(--bg)"/><rect x="222" y="122" width="436" height="356" rx="6" fill="var(--sunken)"/><rect class="box" x="230" y="130" width="420" height="52" rx="1"/><text class="mono small" x="242" y="160.0">█ golem  0.8.0 · qwen3.5:4b · ~/notes</text><text class="small faint" x="640" y="160.0" text-anchor="end">header</text><rect class="box" x="230" y="186" width="420" height="194" rx="1"/><text class="mono small" x="242" y="208">you  Tell a short story</text><text class="mono small" x="242" y="232">golem It mixed ochre with water and…</text><text class="small faint" x="640" y="208" text-anchor="end">transcript</text><text class="small faint" x="640" y="226" text-anchor="end">gets what is left</text><rect class="box" x="230" y="444" width="420" height="22" rx="1"/><text class="mono small faint" x="242" y="459.0">connected · a story · qwen3.5:4b · 3 messages</text><text class="small faint" x="640" y="459.0" text-anchor="end">status</text><rect class="box" x="230" y="410" width="420" height="30" rx="1"/><text class="mono small" x="242" y="429.0">…</text><text class="small faint" x="640" y="429.0" text-anchor="end">composer</text><rect class="box" x="230" y="384" width="420" height="22" rx="1"/><text class="mono small clay" x="242" y="399.0">writing · 412 chars · 3s</text><text class="small faint" x="640" y="399.0" text-anchor="end">meter</text><rect x="20" y="180" width="190" height="80" fill="var(--bg)"/><text class="mono clay" x="30" y="200" font-size="14">a reply streams</text><text class="small faint" x="30" y="222">the meter asks for 1 row,</text><text class="small faint" x="30" y="240">the composer shrinks to …</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6580;0.6700;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/><rect x="220" y="120" width="440" height="360" fill="var(--bg)"/><rect x="222" y="122" width="436" height="356" rx="6" fill="var(--sunken)"/><rect class="box" x="230" y="130" width="420" height="52" rx="1"/><text class="mono small" x="242" y="160.0">█ golem  0.8.0 · qwen3.5:4b · ~/notes</text><text class="small faint" x="640" y="160.0" text-anchor="end">header</text><rect class="box" x="230" y="186" width="420" height="130" rx="1"/><text class="mono small" x="242" y="208">you  Tell a short story</text><text class="mono small" x="242" y="232">golem read_file notes.txt ?</text><text class="small faint" x="640" y="208" text-anchor="end">transcript</text><text class="small faint" x="640" y="226" text-anchor="end">gets what is left</text><rect class="box" x="230" y="444" width="420" height="22" rx="1"/><text class="mono small faint" x="242" y="459.0">connected · a story · qwen3.5:4b · 3 messages</text><text class="small faint" x="640" y="459.0" text-anchor="end">status</text><rect class="box" x="230" y="410" width="420" height="30" rx="1"/><text class="mono small" x="242" y="429.0">…</text><text class="small faint" x="640" y="429.0" text-anchor="end">composer</text><rect class="box" x="230" y="346" width="420" height="60" rx="1" style="fill:var(--soft)"/><text class="mono small" x="242" y="380.0">Allow read_file notes.txt?  a allow · d deny</text><text class="small faint" x="640" y="380.0" text-anchor="end">approval</text><rect class="box" x="230" y="320" width="420" height="22" rx="1"/><text class="mono small clay" x="242" y="335.0">waiting for your approval</text><text class="small faint" x="640" y="335.0" text-anchor="end">meter</text><rect x="20" y="180" width="190" height="80" fill="var(--bg)"/><text class="mono clay" x="30" y="200" font-size="14">a call waits</text><text class="small faint" x="30" y="222">the approval band takes</text><text class="small faint" x="30" y="240">rows, the meter says so</text></g></g>
</svg>
