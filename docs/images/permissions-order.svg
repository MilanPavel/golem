<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" role="img" aria-label="Where golem's rules come from, in the order they are checked: the project's .golem/policy.toml, whose allow rules count only in a trusted folder, then your ~/.golem/config.toml, then the built-in defaults. The first rule that matches decides. A call that asks runs if this session already allowed it, and otherwise waits for approval.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="412" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE CALL IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">3 sources</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">the project, you, then the defaults</text>
<text class="mono label" x="30" y="150">ONE CALL</text><rect class="box" x="30" y="154" width="150" height="44" rx="2"/><path class="wire" d="M180 176 H206"/><path class="head" d="M200 172 L207 176 L200 180 Z"/><rect class="box" x="210" y="152" width="360" height="48" rx="2"/><text class="mono small faint" x="224" y="180">1</text><text x="244" y="173" font-size="15">the project</text><text class="mono small faint" x="556" y="173" text-anchor="end">.golem/policy.toml</text><text x="244" y="191" font-size="13" class="muted">allow counts only if trusted</text><rect class="box" x="210" y="214" width="360" height="48" rx="2"/><text class="mono small faint" x="224" y="242">2</text><text x="244" y="235" font-size="15">you</text><text class="mono small faint" x="556" y="235" text-anchor="end">~/.golem/config.toml</text><text x="244" y="253" font-size="13" class="muted">every rule counts</text><rect class="box" x="210" y="276" width="360" height="48" rx="2"/><text class="mono small faint" x="224" y="304">3</text><text x="244" y="297" font-size="15">built-in defaults</text><text class="mono small faint" x="556" y="297" text-anchor="end"></text><text x="244" y="315" font-size="13" class="muted">read-only and internal: allow · rest: ask</text><path class="wire" d="M390 200 V213"/><path class="head" d="M386 207 L390 214 L394 207 Z"/><path class="wire" d="M390 262 V275"/><path class="head" d="M386 269 L390 276 L394 269 Z"/><path class="wire" d="M570 176 H612 M612 176 V300 M570 238 H612 M570 300 H612"/><path class="wire" d="M612 238 H646"/><path class="head" d="M642 234 L649 238 L642 242 Z"/><rect class="box" x="650" y="186" width="200" height="104" rx="2"/><text class="mono label" x="664" y="208">FIRST MATCH</text><text x="664" y="232" font-size="14">allow: it runs</text><text x="664" y="254" font-size="14">deny: tool.failed</text><text x="664" y="276" font-size="14">ask: next, below</text><path class="wire" d="M750 290 V335"/><path class="head" d="M746 329 L750 336 L754 329 Z"/><rect class="box" x="580" y="338" width="270" height="48" rx="2"/><text x="594" y="358" font-size="14">allowed for this session?</text><text x="594" y="376" font-size="13" class="muted">yes: it runs · no: approval.needed</text>
