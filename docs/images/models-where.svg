;0.1080;0.1200;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M258 268 V218" keyTimes="0;0.2000;0.2700;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1880;0.2000;0.2700;0.2820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M258 268 V218" keyTimes="0;0.2350;0.3050;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2230;0.2350;0.3050;0.3170;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M258 268 V218" keyTimes="0;0.2700;0.3400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2580;0.2700;0.3400;0.3520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M258 268 V218" keyTimes="0;0.3050;0.3750;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2930;0.3050;0.3750;0.3870;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M258 268 V218" keyTimes="0;0.3400;0.4100;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3280;0.3400;0.4100;0.4220;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M258 268 V218" keyTimes="0;0.3750;0.4450;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3630;0.3750;0.4450;0.4570;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="134" y="168" width="188" height="52" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2280;0.2400;0.4400;0.4520;1.0000" values="0;0;1;1;0;0"/></rect></g><path class="wire" d="M440 32 V438"/><text class="mono label" x="456" y="44">LOCAL</text><text class="mono" x="456" y="88" font-size="32" style="fill:var(--clay-ink)">free</text><text x="456" y="114" font-size="15" class="muted">the model runs on your own Mac</text><rect x="456" y="140" width="392" height="200" rx="3" fill="var(--soft)"/><text class="mono label" x="472" y="162">THIS MAC</text><rect class="box" x="562" y="172" width="180" height="44" rx="2"/><text x="652" y="200" text-anchor="middle" font-size="16">The agent</text><rect class="box" x="562" y="270" width="180" height="56" rx="2"/><text x="652" y="294" text-anchor="middle" font-size="16">A local server</text><text class="mono small faint" x="652" y="313" text-anchor="middle">ollama</text><path class="wire" d="M622 216 V269"/><path class="head" d="M618 263 L622 270 L626 263 Z"/><path class="wire back" d="M682 270 V217"/><path class="head" d="M678 223 L682 216 L686 223 Z"/><text class="mono small faint" x="614" y="247" text-anchor="end">request</text><text class="mono small faint" x="690" y="247">tokens</text><rect class="dot" x="456" y="362" width="6" height="6"/><text x="472" y="370" font-size="14" class="muted">private, and works offline</text><rect class="dot" x="456" y="384" width="6" height="6"/><text x="472" y="392" font-size="14" class="muted">no account, no key</text><rect class="dot" x="456" y="406" width="6" height="6"/><text x="472" y="414" font-size="14" class="muted">needs memory and disk</text><g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="1