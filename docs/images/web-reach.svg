<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" role="img" aria-label="A browser reaching a local agent. The agent listens on a Unix socket or a pipe, which a browser can't open: it speaks only HTTP and WebSocket. So a local server on 127.0.0.1 bridges the two. But every page in the browser can send a request to 127.0.0.1: your agent's page, any site you have open, and a site whose name is rebound to 127.0.0.1. So the server checks three things on every request: who, with a secret only your page holds; from where, with the Origin and Host headers; and what, with the list of commands a page may send.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="490" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">127.0.0.1</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">every tab can knock</text>
<text class="mono label" x="30" y="140">THE BROWSER</text><text class="mono label" x="340" y="140">A LOCAL SERVER</text><text class="mono label" x="650" y="140">THE AGENT</text><rect x="30" y="152" width="250" height="262" rx="6" fill="var(--sunken)"/><rect class="box" x="44" y="166" width="222" height="56" rx="2"/><text x="58" y="190" font-size="14">your agent's page</text><text class="small faint" x="58" y="208">opened by the agent's command</text><rect class="box" x="44" y="252" width="222" height="56" rx="2"/><text x="58" y="276" font-size="14">a site you have open</text><text class="small faint" x="58" y="294">any tab, any origin</text><rect class="box" x="44" y="338" width="222" height="56" rx="2"/><text x="58" y="362" font-size="14">a site that rebinds DNS</text><text class="small faint" x="58" y="380">evil.example → 127.0.0.1</text><rect class="box" x="340" y="152" width="250" height="262" rx="2"/><text class="mono" x="354" y="178" font-size="14">127.0.0.1:port</text><text class="small faint" x="354" y="196">HTTP and WebSocket</text><text class="mono small" x="354" y="236">who?</text><text class="small faint" x="354" y="254">a secret only your page holds</text><text class="mono small" x="354" y="292">from where?</text><text class="small faint" x="354" y="310">the Origin and Host headers</text><text class="mono small" x="354" y="348">may it?</text><text class="small faint" x="354" y="366">which commands a page may send</text><rect class="box" x="650" y="166" width="200" height="56" rx="2" style="fill:var(--soft)"/><text x="664" y="190" font-size="14">the agent</text><text class="small faint" x="664" y="208">a Unix socket or a pipe</text><text class="small faint" x="650" y="252">A browser can open neither.</text><text class="small faint" x="650" y="272">It speaks only HTTP and</text><text class="small faint" x="650" y="292">WebSocket.</text><path class="wire" d="M266 194 H337"/><path class="head" d="M331 190 L338 194 L331 198 Z"/><path class="wire" d="M590 194 H647"/><path class="head" d="M641 190 L648 194 L641 198 Z"/><path class="wire back" d="M266 280 H338"/><path class="head" d="M331 276 L338 280 L331 284 Z"/><path class="wire back" d="M266 366 H338"/><path class="head" d="M331 362 L338 366 L331 370 Z"/><rect class="dot" x="30" y="444" width="6" height="6"/><text x="46" y="452" font-size="14" class="muted">Loopback is not private. Every page in the browser can send a request to 127.0.0.1</text><rect class="dot" x="30" y="466" width="6" height="6"/><text x="46" y="474" font-size="14" class="muted">So the server checks who, from where, and what, on every request</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M266 194 H338" keyTimes="0;0.0400;0.1000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0280;0.0400;0.1000;0.1120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="346" y="222" width="238" height="40" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0880;0.1000;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="346" y="278" width="238" height="40" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1880;0.2000;0.3000;0.3120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M590 194 H648" keyTimes="0;0.3000;0.3600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2880;0.3000;0.3600;0.3720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="646" y="162" width="208" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3480;0.3600;0.4600;0.4720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M266 280 H338" keyTimes="0;0.5200;0.5800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5080;0.5200;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="346" y="222" width="238" height="40" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5680;0.5800;0.7000;0.7120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="460" y="236">no secret ✗<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5680;0.5800;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M266 366 H338" keyTimes="0;0.7600;0.8200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7480;0.7600;0.8200;0.8320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="346" y="278" width="238" height="40" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8080;0.8200;0.9400;0.9520;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="460" y="292">wrong Host ✗<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8080;0.8200;0.9600;0.9720;1.0000" values="0;0;1;1;0;0"/></text></g>
</svg>
