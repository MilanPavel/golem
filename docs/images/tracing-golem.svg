<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 488" role="img" aria-label="golem's trace: while a session runs, golem writes events, checkpoint messages, and blobs. The method trace.get reads only the events, and build_trace turns them into a tree of summaries. The method trace.span reads the events, the checkpoint messages, and the blobs, and read_span returns one span in full with its context split.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="488" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE TRACE IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">2 methods</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">the tree is joined when you ask</text>
<rect x="20" y="130" width="840" height="244" rx="3" fill="var(--soft)"/>
<rect class="box" x="30" y="150" width="250" height="70" rx="2"/><text class="mono label" x="46" y="172">EVENTS</text><text class="mono small" x="46" y="192">model.call.*, tool.*</text><text class="mono small" x="46" y="210">tokens, timings, duration_ms</text><rect class="box" x="30" y="234" width="250" height="56" rx="2"/><text class="mono label" x="46" y="256">CHECKPOINT</text><text class="small muted" x="46" y="276">the messages, each with an id</text><rect class="box" x="30" y="304" width="250" height="56" rx="2"/><text class="mono label" x="46" y="326">BLOBS</text><text class="small muted" x="46" y="346">system prompt and tools, by sha256</text><rect class="box" x="344" y="150" width="190" height="52" rx="2"/><text class="mono label" x="358" y="172">BUILD_TRACE</text><text class="small muted" x="358" y="191">events into a tree</text><rect class="box" x="344" y="248" width="190" height="82" rx="2"/><text class="mono label" x="358" y="270">READ_SPAN</text><text class="small muted" x="358" y="290">messages by id</text><text class="small muted" x="358" y="308">prompt and tools by hash</text><text class="small muted" x="358" y="326">context split, estimated</text><rect class="box" x="598" y="150" width="252" height="52" rx="2"/><text class="mono label" x="612" y="172">TRACE.GET</text><text class="small muted" x="612" y="191">the tree, summaries only</text><rect class="box" x="598" y="248" width="252" height="82" rx="2"/><text class="mono label" x="612" y="270">TRACE.SPAN</text><text class="small muted" x="612" y="290">one span in full:</text><text class="small muted" x="612" y="308">input, output, and what</text><text class="small muted" x="612" y="326">filled the context</text><path class="wire" d="M280 176 H341"/><path class="head" d="M335 172 L342 176 L335 180 Z"/><path class="wire" d="M534 176 H595"/><path class="head" d="M589 172 L596 176 L589 180 Z"/><path class="wire" d="M310 176 V332 M280 262 H310 M280 332 H310"/><path class="wire" d="M310 289 H341"/><path class="head" d="M335 285 L342 289 L335 293 Z"/><path class="wire" d="M534 289 H595"/><path class="head" d="M589 285 L596 289 L589 293 Z"/>
<rect class="dot" x="40" y="402" width="6" height="6"/><text x="56" y="410" font-size="14" class="muted">nothing is joined while a session runs; it only writes</text><rect class="dot" x="40" y="424" width="6" height="6"/><text x="56" y="432" font-size="14" class="muted">trace.get reads the events alone</text><rect class="dot" x="40" y="446" width="6" height="6"/><text x="56" y="454" font-size="14" class="muted">trace.span adds the messages and the stored request</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 176 H344" keyTimes="0;0.0300;0.1000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.1000;0.1120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="340" y="146" width="198" height="60" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0880;0.1000;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M534 176 H598" keyTimes="0;0.2000;0.2700;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1880;0.2000;0.2700;0.2820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="594" y="146" width="260" height="60" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2580;0.2700;0.4200;0.4320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 186 H310 V289 H344" keyTimes="0;0.5200;0.6000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5080;0.5200;0.6000;0.6120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 262 H310 V289 H344" keyTimes="0;0.5200;0.6000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5080;0.5200;0.6000;0.6120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 332 H310 V289 H344" keyTimes="0;0.5200;0.6000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5080;0.5200;0.6000;0.6120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="340" y="244" width="198" height="90" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5880;0.6000;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M534 289 H598" keyTimes="0;0.7200;0.7900;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.7900;0.8020;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="594" y="244" width="260" height="90" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7780;0.7900;0.9500;0.9620;1.0000" values="0;0;1;1;0;0"/></rect></g>
</svg>
