it" x="26" y="318" width="548" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3680;0.3800;0.5000;0.5120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M300 388 V418" keyTimes="0;0.5000;0.5400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4880;0.5000;0.5400;0.5520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="414" width="548" height="52" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5280;0.5400;0.6200;0.6320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="594" y="132" width="262" height="38" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.7800;0.7920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="126" width="548" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.7800;0.7920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="594" y="264" width="262" height="38" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8080;0.8200;0.9400;0.9520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="222" width="548" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8080;0.8200;0.9400;0.9520;1.0000" values="0;0;1;1;0;0"/></rect></g>
