<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" role="img" aria-label="golem's gateway, started by golem web on 127.0.0.1 port 7480, in three stages from the page down. The login checks that Host and Origin are exactly 127.0.0.1 and the port, and that the cookie names a live secret. The filter lets through one JSON object per message, with no line break, and only a method a browser may call. The bridge opens one daemon connection per WebSocket and passes lines on unchanged to golem.sock. The daemon is unchanged, with no port and no cookie. Real refusals: Origin evil.example got 403, an upgrade with no cookie was opened and closed with 4401, two objects joined by a newline closed the link with 1008, and auth.set got error -32020. A tab that can't keep up pauses the daemon socket at 4 MiB. hello, session.create, session.attach, and message.send passed through unchanged, and 67 deltas reached the page and a terminal client on the socket alike.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="548" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">THE GATEWAY, IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">3</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a door, a filter, a bridge</text>
<text class="mono label" x="30" y="118">GOLEM WEB, 127.0.0.1:7480</text><rect class="box" x="30" y="130" width="540" height="64" rx="2"/><text class="mono" x="44" y="154" font-size="14">login</text><text class="small faint" x="44" y="172">Host and Origin exactly 127.0.0.1:port, and the cookie's secret</text><rect class="box" x="30" y="226" width="540" height="64" rx="2"/><text class="mono" x="44" y="250" font-size="14">filter</text><text class="small faint" x="44" y="268">one JSON object per message, no line break, a method a browser may call</text><rect class="box" x="30" y="322" width="540" height="64" rx="2"/><text class="mono" x="44" y="346" font-size="14">bridge</text><text class="small faint" x="44" y="364">one daemon connection per WebSocket, lines passed on unchanged</text><rect class="box" x="30" y="418" width="540" height="44" rx="2"/><text class="mono" x="44" y="442" font-size="14">golem.sock</text><text class="small faint" x="160" y="446">the daemon, unchanged: no port, no cookie</text><path class="wire" d="M300 196 V217"/><path class="head" d="M296 211 L300 218 L304 211 Z"/><path class="wire" d="M300 292 V313"/><path class="head" d="M296 307 L300 314 L304 307 Z"/><path class="wire" d="M300 388 V409"/><path class="head" d="M296 403 L300 410 L304 403 Z"/><text class="mono label" x="600" y="118">STOPPED HERE</text><text class="mono small" x="600" y="146">Origin evil.example</text><text class="mono small clay" x="600" y="162">403 bad origin</text><text class="mono small" x="600" y="182">no cookie</text><text class="mono small clay" x="600" y="198">opened, then closed 4401</text><text class="mono small" x="600" y="242">two objects, one \n</text><text class="mono small clay" x="600" y="258">closed 1008</text><text class="mono small" x="600" y="278">auth.set</text><text class="mono small clay" x="600" y="294">error -32020</text><text class="mono small" x="600" y="338">a tab that can't keep up</text><text class="mono small clay" x="600" y="354">pause the socket at 4 MiB</text><rect class="dot" x="30" y="492" width="6" height="6"/><text x="46" y="500" font-size="14" class="muted">hello, session.create, session.attach, and message.send passed through unchanged</text><rect class="dot" x="30" y="514" width="6" height="6"/><text x="46" y="522" font-size="14" class="muted">67 deltas reached the page and a terminal client on the socket: the same 360 characters</text>
