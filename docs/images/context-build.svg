<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 466" role="img" aria-label="One model call in golem. The SystemPrompt reads the session's pins and each pinned SKILL.md, and builds the system message. It goes in front of the history from the checkpoint, for this one call. Only the model's reply is stored, so the checkpoint never holds the prompt. session.inspect builds the same prompt, so /debug model shows it.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="466" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE CALL IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">per call</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">built fresh, never stored</text>
<text class="mono label" x="30" y="140">WHAT IT READS</text><rect class="box" x="30" y="152" width="200" height="52" rx="2"/><text class="mono" x="44" y="175.0" font-size="13">sessions.skills</text><text class="small faint" x="44" y="192.0">the pins: terse</text><rect class="box" x="30" y="226" width="200" height="52" rx="2"/><text class="mono" x="44" y="249.0" font-size="13">terse/SKILL.md</text><text class="small faint" x="44" y="266.0">read again for every call</text><rect class="box" x="30" y="316" width="200" height="52" rx="2"/><text class="mono" x="44" y="339.0" font-size="13">checkpoint</text><text class="small faint" x="44" y="356.0">the messages, no prompt</text><text class="mono label" x="290" y="140">BUILT FOR THIS CALL</text><rect class="box" x="290" y="152" width="200" height="126" rx="2"/><text class="mono" x="304" y="178" font-size="13">SystemPrompt</text><text class="small faint" x="304" y="198">its sections, in order</text><rect x="304" y="212" width="172" height="50" rx="2" fill="var(--soft)"/><text class="mono small" x="316" y="232">pinned skills</text><text class="small faint" x="316" y="250">the one section today</text><path class="wire" d="M230 178 H286"/><path class="head" d="M280 174 L287 178 L280 182 Z"/><path class="wire" d="M230 252 H300"/><path class="head" d="M294 248 L301 252 L294 256 Z"/><text class="small faint" x="290" y="302">session.inspect builds the same,</text><text class="small faint" x="290" y="320">so /debug model shows it</text><text class="mono label" x="550" y="140">ONE MODEL CALL</text><rect x="550" y="196" width="150" height="40" rx="2" fill="var(--soft)" stroke="var(--line)"/><text class="mono small" x="564" y="221">system message</text><rect x="550" y="236" width="150" height="62" rx="2" class="box" stroke="var(--line)"/><text class="mono small" x="564" y="262">history</text><text class="small faint" x="564" y="280">from the checkpoint</text><path class="wire" d="M490 216 H546"/><path class="head" d="M540 212 L547 216 L540 220 Z"/><path class="wire" d="M230 342 H520 V276 H546"/><path class="head" d="M540 272 L547 276 L540 280 Z"/><path class="wire" d="M700 246 H756"/><path class="head" d="M750 242 L757 246 L750 250 Z"/><rect class="box" x="760" y="218" width="90" height="56" rx="2"/><text class="mono label" x="805" y="251" text-anchor="middle">MODEL</text><path class="wire back" d="M805 274 V404 H130 V370"/><path class="head" d="M126 377 L130 370 L134 377 Z"/><text class="small faint" x="470" y="398" text-anchor="middle">only the reply is stored</text>
<text class="small muted" x="30" y="440">An edit to the skill shows on the next call. The checkpoint holds only what was said.</text>
