t><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M230 342 H520 V276 H548" keyTimes="0;0.4000;0.4700;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3880;0.4000;0.4700;0.4820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="546" y="192" width="158" height="110" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4580;0.4700;0.6000;0.6120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M700 246 H758" keyTimes="0;0.5500;0.6000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5380;0.5500;0.6000;0.6120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="756" y="214" width="98" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5880;0.6000;0.7000;0.7120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M805 274 V404 H130 V370" keyTimes="0;0.6800;0.8000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6680;0.6800;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="312" width="208" height="60" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7880;0.8000;0.9000;0.9120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="550" y="322">system message: dropped<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6880;0.7000;0.9000;0.9120;1.0000" values="0;0;1;1;0;0"/></text></g>
</svg>
