<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" role="img" aria-label="Two guards: a permission decides whether a command runs, and a sandbox decides what a running command may touch. rm -rf ~ is stopped at the permission, because you said no. cat ~/.ssh/id_ed25519 was allowed by mistake, and the sandbox stops it. pytest -q passes both and reaches the project.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="432" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">2 guards</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">one says whether, one says how far</text>
<rect x="337" y="168" width="6" height="204" rx="3" style="fill:var(--clay)" opacity=".55"/><text class="mono label" x="340" y="140" text-anchor="middle">PERMISSION</text><text x="340" y="158" text-anchor="middle" font-size="13" class="muted">may it run?</text><rect x="577" y="168" width="6" height="204" rx="3" style="fill:var(--clay)" opacity=".55"/><text class="mono label" x="580" y="140" text-anchor="middle">SANDBOX</text><text x="580" y="158" text-anchor="middle" font-size="13" class="muted">what may it touch?</text><rect class="box" x="30" y="178" width="240" height="44" rx="2"/><text class="mono" x="44" y="205" font-size="13">rm -rf ~</text><path class="edge" d="M270 200 H660"/><rect class="box" x="660" y="178" width="190" height="44" rx="2"/><text x="674" y="205" font-size="14">your home folder</text><text class="small faint" x="352" y="192">you said no</text><rect class="box" x="30" y="248" width="240" height="44" rx="2"/><text class="mono" x="44" y="275" font-size="13">cat ~/.ssh/id_ed25519</text><path class="edge" d="M270 270 H660"/><rect class="box" x="660" y="248" width="190" height="44" rx="2"/><text x="674" y="275" font-size="14">your SSH keys</text><text class="small faint" x="352" y="262">you said yes, by mistake</text><rect class="box" x="30" y="318" width="240" height="44" rx="2"/><text class="mono" x="44" y="345" font-size="13">pytest -q</text><path class="edge" d="M270 340 H660"/><rect class="box" x="660" y="318" width="190" height="44" rx="2"/><text x="674" y="345" font-size="14">the project</text><text class="small faint" x="352" y="332">you said yes</text>
<text class="small muted" x="30" y="408">A wrong yes is stopped by the sandbox. A command that runs reaches only what it is meant to.</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M270 200 H334" keyTimes="0;0.0400;0.1100;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0280;0.0400;0.1100;0.1220;1.0000" values="0;0;1;1;0;0"/></rect><text class="mono clay" x="340" y="207" text-anchor="middle" font-size="22" opacity="0">×<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0980;0.1100;0.3200;0.3320;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M270 270 H574" keyTimes="0;0.3500;0.4700;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3380;0.3500;0.4700;0.4820;1.0000" values="0;0;1;1;0;0"/></rect><text class="mono clay" x="580" y="277" text-anchor="middle" font-size="22" opacity="0">×<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4580;0.4700;0.6300;0.6420;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M270 340 H656" keyTimes="0;0.6600;0.8100;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.8100;0.8220;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="656" y="314" width="198" height="52" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7980;0.8100;0.9400;0.9520;1.0000" values="0;0;1;1;0;0"/></rect></g>
</svg>
