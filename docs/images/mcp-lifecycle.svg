<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 638" role="img" aria-label="One MCP connection, in three parts. The handshake: the agent's client sends initialize with its protocol version and capabilities, the server answers with its own, and the client sends notifications/initialized. Discovery: tools/list returns the server's tools with their schemas, and the agent offers them to the model with its own. A call: when the model calls list_issues, the client sends tools/call, and the result goes back to the model. The model never talks to the server.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="638" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">JSON-RPC</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a few messages, the same for any server</text>
<rect class="box" x="26" y="128" width="148" height="30" rx="2"/><text class="mono label" x="100" y="148" text-anchor="middle">THE MODEL</text><path class="edge" d="M100 158 V582"/><rect class="box" x="316" y="128" width="148" height="30" rx="2"/><text class="mono label" x="390" y="148" text-anchor="middle">THE AGENT</text><path class="edge" d="M390 158 V582"/><rect class="box" x="606" y="128" width="148" height="30" rx="2"/><text class="mono label" x="680" y="148" text-anchor="middle">A SERVER</text><path class="edge" d="M680 158 V582"/><text class="small faint" x="382" y="176" text-anchor="end">with its MCP client</text><path class="wire" d="M744 184 H750 V286 H744"/><text class="mono small faint" x="760" y="239.0">1 · HANDSHAKE</text><path class="wire" d="M744 304 H750 V406 H744"/><text class="mono small faint" x="760" y="359.0">2 · DISCOVER</text><path class="wire" d="M744 424 H750 V566 H744"/><text class="mono small faint" x="760" y="499.0">3 · CALL</text><path class="wire" d="M390 194 H673"/><path class="head" d="M673 190 L680 194 L673 198 Z"/><text class="mono small" x="535.0" y="188" text-anchor="middle">initialize</text><text class="small faint" x="535.0" y="209" text-anchor="middle">my protocol version, and what I can do</text><path class="wire back" d="M680 234 H397"/><path class="head" d="M397 230 L390 234 L397 238 Z"/><text class="mono small" x="535.0" y="228" text-anchor="middle">result</text><text class="small faint" x="535.0" y="249" text-anchor="middle">the same version, and: I have tools</text><path class="wire" d="M390 274 H673"/><path class="head" d="M673 270 L680 274 L673 278 Z"/><text class="mono small" x="535.0" y="268" text-anchor="middle">notifications/initialized</text><text class="small faint" x="535.0" y="289" text-anchor="middle">a notification: no answer</text><path class="wire" d="M390 314 H673"/><path class="head" d="M673 310 L680 314 L673 318 Z"/><text class="mono small" x="535.0" y="308" text-anchor="middle">tools/list</text><text class="small faint" x="535.0" y="329" text-anchor="middle">what can you do?</text><path class="wire back" d="M680 354 H397"/><path class="head" d="M397 350 L390 354 L397 358 Z"/><text class="mono small" x="535.0" y="348" text-anchor="middle">result</text><text class="small faint" x="535.0" y="369" text-anchor="middle">list_issues, create_issue, with schemas</text><path class="wire back" d="M390 394 H107"/><path class="head" d="M107 390 L100 394 L107 398 Z"/><text class="small" x="245.0" y="388" text-anchor="middle">the tool list</text><text class="small faint" x="245.0" y="409" text-anchor="middle">with the agent's own tools</text><path class="wire" d="M100 434 H383"/><path class="head" d="M383 430 L390 434 L383 438 Z"/><text class="small" x="245.0" y="428" text-anchor="middle">call list_issues</text><text class="small faint" x="245.0" y="449" text-anchor="middle">{"state": "open"}</text><path class="wire" d="M390 474 H673"/><path class="head" d="M673 470 L680 474 L673 478 Z"/><text class="mono small" x="535.0" y="468" text-anchor="middle">tools/call</text><text class="small faint" x="535.0" y="489" text-anchor="middle">list_issues {"state": "open"}</text><path class="wire back" d="M680 514 H397"/><path class="head" d="M397 510 L390 514 L397 518 Z"/><text class="mono small" x="535.0" y="508" text-anchor="middle">result</text><text class="small faint" x="535.0" y="529" text-anchor="middle">content: #41 …, #42 …</text><path class="wire back" d="M390 554 H107"/><path class="head" d="M107 550 L100 554 L107 558 Z"/><text class="small" x="245.0" y="548" text-anchor="middle">the tool result</text><text class="small faint" x="245.0" y="569" text-anchor="middle">the model reads it next</text>
<text class="small muted" x="30" y="612">The agent runs the conversation, and the model never talks to the server. To the model, it is one more tool.</text>
<g class="anim"><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M390 194 H680" keyTimes="0;0.0300;0.0900;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.0900;0.1020;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="535.0" y="188" text-anchor="middle">initialize<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.1200;0.1320;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M680 234 H390" keyTimes="0;0.1200;0.1800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1080;0.1200;0.1800;0.1920;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="535.0" y="228" text-anchor="middle">result<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1080;0.1200;0.2100;0.2220;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M390 274 H680" keyTimes="0;0.2100;0.2700;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1980;0.2100;0.2700;0.2820;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="535.0" y="268" text-anchor="middle">notifications/initialized<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1980;0.2100;0.3000;0.3120;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M390 314 H680" keyTimes="0;0.3000;0.3600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2880;0.3000;0.3600;0.3720;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="535.0" y="308" text-anchor="middle">tools/list<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2880;0.3000;0.3900;0.4020;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M680 354 H390" keyTimes="0;0.3900;0.4500;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3780;0.3900;0.4500;0.4620;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="535.0" y="348" text-anchor="middle">result<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3780;0.3900;0.4800;0.4920;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M390 394 H100" keyTimes="0;0.4800;0.5400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4680;0.4800;0.5400;0.5520;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="small clay" x="245.0" y="388" text-anchor="middle">the tool list<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4680;0.4800;0.5700;0.5820;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M100 434 H390" keyTimes="0;0.5700;0.6300;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5580;0.5700;0.6300;0.6420;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="small clay" x="245.0" y="428" text-anchor="middle">call list_issues<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5580;0.5700;0.6600;0.6720;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M390 474 H680" keyTimes="0;0.6600;0.7200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="535.0" y="468" text-anchor="middle">tools/call<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.7500;0.7620;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M680 514 H390" keyTimes="0;0.7500;0.8100;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7380;0.7500;0.8100;0.8220;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="535.0" y="508" text-anchor="middle">result<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7380;0.7500;0.8400;0.8520;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-4.0" y="-4.0" width="8" height="8" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M390 554 H100" keyTimes="0;0.8400;0.9000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8280;0.8400;0.9000;0.9120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="small clay" x="245.0" y="548" text-anchor="middle">the tool result<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8280;0.8400;0.9300;0.9420;1.0000" values="0;0;1;1;0;0"/></text></g>
</svg>
