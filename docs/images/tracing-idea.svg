<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 454" role="img" aria-label="A trace in general: a run is cut into spans. The run holds three model calls, and two tool calls sit under the model calls that asked for them. Each span has its time as a bar, what it took in, and what it gave out. The third model call has the widest bar, so it is the slow step.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="454" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">1 tree</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a run, cut into spans</text>
<rect class="box" x="30" y="146" width="560" height="190" rx="2"/><text class="mono label" x="46" y="140">SPANS</text><text class="mono label" x="292" y="140">TIME</text><text class="" x="46" y="169" font-size="14">Run: fix the bug</text><rect x="292" y="158" width="300" height="14" rx="2" style="fill:var(--line)" opacity=".7"/><text class="" x="62" y="199" font-size="14">Model call 1</text><rect x="292" y="188" width="30" height="14" rx="2" style="fill:var(--line)" opacity=".7"/><text class="mono small" x="78" y="229">grep</text><rect x="322" y="218" width="6" height="14" rx="2" style="fill:var(--line)" opacity=".7"/><text class="" x="62" y="259" font-size="14">Model call 2</text><rect x="328" y="248" width="66" height="14" rx="2" style="fill:var(--line)" opacity=".7"/><text class="mono small" x="78" y="289">edit_file</text><rect x="394" y="278" width="9" height="14" rx="2" style="fill:var(--line)" opacity=".7"/><text class="" x="62" y="319" font-size="14">Model call 3</text><rect x="403" y="308" width="189" height="14" rx="2" style="fill:var(--line)" opacity=".7"/><rect class="box" x="612" y="146" width="238" height="190" rx="2"/><text class="mono label" x="626" y="172">THIS SPAN TOOK IN</text><text class="mono label" x="626" y="236">AND GAVE OUT</text><text class="mono label" x="626" y="300">IT TOOK</text>
<rect class="dot" x="40" y="364" width="6" height="6"/><text x="56" y="372" font-size="14" class="muted">a span is one step: a start, an end, a status</text><rect class="dot" x="40" y="386" width="6" height="6"/><text x="56" y="394" font-size="14" class="muted">it keeps its exact input and output</text><rect class="dot" x="40" y="408" width="6" height="6"/><text x="56" y="416" font-size="14" class="muted">a tool sits under the model call that asked for it</text>
