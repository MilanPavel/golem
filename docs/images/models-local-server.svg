<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="A local Ollama's life: when something needs it, golem checks whether one answers. If not, it runs ollama serve and waits up to 60 seconds, holds it while calls use it, and stops it after 30 idle minutes or when golem stops. A server that already answered is external: golem uses it and never stops it.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="360" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">A LOCAL OLLAMA, START TO STOP</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">1 rule</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">golem stops only a server it started</text>
<rect x="32" y="150" width="144" height="80" rx="2" fill="var(--surface)"/><text x="104.0" y="178" text-anchor="middle" font-size="14">Something needs it</text><text class="mono small faint" x="104.0" y="200" text-anchor="middle">a call, /model,</text><text class="mono small faint" x="104.0" y="216" text-anchor="middle">or a download</text><path class="wire" d="M176 190.0 H199"/><path class="head" d="M193 186.0 L200 190.0 L193 194.0 Z"/><rect x="200" y="150" width="144" height="80" rx="2" fill="var(--surface)"/><text x="272.0" y="178" text-anchor="middle" font-size="14">Is one answering?</text><text class="mono small faint" x="272.0" y="200" text-anchor="middle">GET /api/tags</text><path class="wire" d="M344 190.0 H367"/><path class="head" d="M361 186.0 L368 190.0 L361 194.0 Z"/><rect x="368" y="150" width="144" height="80" rx="2" fill="var(--surface)"/><text x="440.0" y="178" text-anchor="middle" font-size="14">ollama serve</text><text class="mono small faint" x="440.0" y="200" text-anchor="middle">waits up to 60 s</text><text class="mono small faint" x="440.0" y="216" text-anchor="middle">logs/ollama.log</text><path class="wire" d="M512 190.0 H535"/><path class="head" d="M529 186.0 L536 190.0 L529 194.0 Z"/><rect x="536" y="150" width="144" height="80" rx="2" fill="var(--soft)"/><text x="608.0" y="178" text-anchor="middle" font-size="14">Ready, and held</text><text class="mono small faint" x="608.0" y="200" text-anchor="middle">while calls</text><text class="mono small faint" x="608.0" y="216" text-anchor="middle">use it</text><path class="wire" d="M680 190.0 H703"/><path class="head" d="M697 186.0 L704 190.0 L697 194.0 Z"/><rect x="704" y="150" width="144" height="80" rx="2" fill="var(--surface)"/><text x="776.0" y="178" text-anchor="middle" font-size="14">Stopped</text><text class="mono small faint" x="776.0" y="200" text-anchor="middle">after 30 idle min,</text><text class="mono small faint" x="776.0" y="216" text-anchor="middle">or golem stops</text><text class="mono small faint" x="356.0" y="182.0" text-anchor="middle">no</text><path class="wire" d="M272.0 230 V281"/><path class="head" d="M268.0 275 L272.0 282 L276.0 275 Z"/><text class="mono small faint" x="282.0" y="260">yes</text><rect x="142.0" y="282" width="260" height="54" rx="2" fill="var(--surface)"/><text x="272.0" y="305" text-anchor="middle" font-size="14">External: used, never stopped</text><text class="mono small faint" x="272.0" y="324" text-anchor="middle">brew services, the Ollama app</text><text x="470" y="292" font-size="14" class="muted">golem keeps the pid of the one it started in</text><text class="mono small" x="470" y="313">run/ollama-&lt;port&gt;.pid</text><text x="470" y="334" font-size="14" class="muted">so a restarted daemon takes it back.</text>
<g class="anim"><rect class="lit" x="29" y="147" width="150" height="86" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0080;0.0200;0.0800;0.0920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M176 190.0 H200" keyTimes="0;0.0800;0.1200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0680;0.0800;0.1200;0.1320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="197" y="147" width="150" height="86" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1080;0.1200;0.1700;0.1820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M344 190.0 H368" keyTimes="0;0.1700;0.2100;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1580;0.1700;0.2100;0.2220;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="365" y="147" width="150" height="86" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1980;0.2100;0.3200;0.3320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M512 190.0 H536" keyTimes="0;0.3200;0.3600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3080;0.3200;0.3600;0.3720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="533" y="147" width="150" height="86" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3480;0.3600;0.4800;0.4920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M680 190.0 H704" keyTimes="0;0.4800;0.5200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4680;0.4800;0.5200;0.5320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="701" y="147" width="150" height="86" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5080;0.5200;0.6000;0.6120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="29" y="147" width="150" height="86" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.7100;0.7220;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M176 190.0 H200" keyTimes="0;0.7100;0.7500;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6980;0.7100;0.7500;0.7620;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="197" y="147" width="150" height="86" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7380;0.7500;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M272.0 230 V280" keyTimes="0;0.8000;0.8500;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7880;0.8000;0.8500;0.8620;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="139.0" y="279" width="266" height="60" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8380;0.8500;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></rect></g>
</svg>
