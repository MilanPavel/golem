<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-label="One shape for the daemon and every client. The messages are Python classes in golem_protocol. just gen writes a JSON Schema and a TypeScript file for each message into packages/protocol/gen, and @golem/client uses them. The TUI and golem status reach the daemon over the Unix socket, one JSON object per line. A web page reaches it over a WebSocket through golem web, the gateway, which checks the token, the Origin, and the method, and passes the same line on. The daemon reads each line into the same Python classes.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="500" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE SHAPE IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">1 source</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">for the daemon and every client</text>
<rect class="box" x="30" y="150" width="200" height="56" rx="2"/><text class="mono" x="44" y="174" font-size="14">golem_protocol</text><text class="small faint" x="44" y="192">Python classes: the source</text><path class="wire" d="M230 178 H296"/><path class="head" d="M290 174 L297 178 L290 182 Z"/><text class="mono small" x="264" y="170" text-anchor="middle">just gen</text><rect class="box" x="300" y="150" width="230" height="56" rx="2"/><text class="mono" x="314" y="174" font-size="14">packages/protocol/gen</text><text class="small faint" x="314" y="192">per message: schema + .ts</text><path class="wire" d="M530 178 H566"/><path class="head" d="M560 174 L567 178 L560 182 Z"/><rect class="box" x="570" y="150" width="280" height="56" rx="2"/><text class="mono" x="584" y="174" font-size="14">@golem/client</text><text class="small faint" x="584" y="192">one client, two links</text><path class="wire" d="M130 206 V291"/><path class="head" d="M126 285 L130 292 L134 285 Z"/><text class="small faint" x="140" y="254">the same classes</text><rect class="box" x="30" y="294" width="220" height="150" rx="2" style="fill:var(--soft)"/><text x="44" y="318" font-size="14">the daemon</text><text class="small faint" x="44" y="336">reads each line into</text><text class="small faint" x="44" y="352">a class, or answers an error</text><text class="mono small" x="44" y="380">run/golem.sock</text><text class="small faint" x="44" y="398">mode 0600, no port</text><path class="wire" d="M608 206 V255"/><path class="head" d="M604 249 L608 256 L612 249 Z"/><rect class="box" x="570" y="258" width="76" height="40" rx="2"/><text x="580" y="283" font-size="13">the TUI</text><path class="wire" d="M704 206 V255"/><path class="head" d="M700 249 L704 256 L708 249 Z"/><rect class="box" x="654" y="258" width="100" height="40" rx="2"/><text x="664" y="283" font-size="13">golem status</text><path class="wire" d="M806 206 V255"/><path class="head" d="M802 249 L806 256 L810 249 Z"/><rect class="box" x="762" y="258" width="88" height="40" rx="2"/><text x="772" y="283" font-size="13">a web page</text><path class="wire" d="M608 298 V340 M704 298 V340 M704 340 H253"/><path class="head" d="M260 336 L253 340 L260 344 Z"/><text class="small faint" x="270" y="332">unix-link: the socket, one JSON object per line</text><path class="wire" d="M806 298 V379"/><path class="head" d="M802 373 L806 380 L810 373 Z"/><text class="small faint" x="736" y="324">WebSocket</text><rect class="box" x="620" y="382" width="230" height="56" rx="2"/><text class="mono" x="634" y="406" font-size="14">golem web</text><text class="small faint" x="634" y="424">the gateway: token, Origin, methods</text><path class="wire" d="M620 410 H254"/><path class="head" d="M260 406 L253 410 L260 414 Z"/><text class="small faint" x="270" y="402">the same line, never re-written</text>
<text class="small muted" x="30" y="476">Change a class, run just gen, and the TypeScript changes with it. just check fails if it did not.</text>
