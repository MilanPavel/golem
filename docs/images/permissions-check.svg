<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" role="img" aria-label="Permission rules: each tool call goes down one list of rules, in order, and the first rule that fits decides. read_file .env meets a deny rule first. shell pytest -q is allowed by the second rule. shell rm -rf build fits only the last rule, so a person is asked.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="392" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">first match</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">the first rule that fits decides</text>
<text class="mono label" x="300" y="150">RULES, IN ORDER</text><rect class="box" x="300" y="158" width="300" height="36" rx="2"/><text class="mono small faint" x="312" y="180">1</text><text class="mono" x="332" y="181" font-size="13" style="fill:var(--clay-ink)">deny</text><text class="mono" x="384" y="181" font-size="13">read_file</text><text class="mono small faint" x="588" y="180" text-anchor="end">path **/.env</text><rect class="box" x="300" y="204" width="300" height="36" rx="2"/><text class="mono small faint" x="312" y="226">2</text><text class="mono" x="332" y="227" font-size="13" style="fill:var(--clay-ink)">allow</text><text class="mono" x="384" y="227" font-size="13">shell</text><text class="mono small faint" x="588" y="226" text-anchor="end">match pytest*</text><rect class="box" x="300" y="250" width="300" height="36" rx="2"/><text class="mono small faint" x="312" y="272">3</text><text class="mono" x="332" y="273" font-size="13" style="fill:var(--clay-ink)">allow</text><text class="mono" x="384" y="273" font-size="13">any read-only tool</text><text class="mono small faint" x="588" y="272" text-anchor="end"></text><rect class="box" x="300" y="296" width="300" height="36" rx="2"/><text class="mono small faint" x="312" y="318">4</text><text class="mono" x="332" y="319" font-size="13" style="fill:var(--clay-ink)">ask</text><text class="mono" x="384" y="319" font-size="13">everything else</text><text class="mono small faint" x="588" y="318" text-anchor="end"></text><rect class="box" x="680" y="160" width="170" height="48" rx="2"/><text class="mono label" x="694" y="180">ALLOW</text><text x="694" y="198" font-size="13" class="muted">it runs</text><rect class="box" x="680" y="228" width="170" height="48" rx="2"/><text class="mono label" x="694" y="248">ASK</text><text x="694" y="266" font-size="13" class="muted">a person decides</text><rect class="box" x="680" y="296" width="170" height="48" rx="2"/><text class="mono label" x="694" y="316">DENY</text><text x="694" y="334" font-size="13" class="muted">the model reads why</text><text class="mono label" x="30" y="150">A TOOL CALL</text><rect class="box" x="30" y="200" width="220" height="44" rx="2"/><path class="wire" d="M250 222 H296"/><path class="head" d="M290 218 L297 222 L290 226 Z"/><path class="wire" d="M600 176 H640"/><path class="wire" d="M600 222 H640"/><path class="wire" d="M600 268 H640"/><path class="wire" d="M600 314 H640"/><path class="wire" d="M640 176 V320"/><path class="wire" d="M640 184 H674"/><path class="head" d="M670 180 L677 184 L670 188 Z"/><path class="wire" d="M640 252 H674"/><path class="head" d="M670 248 L677 252 L670 256 Z"/><path class="wire" d="M640 320 H674"/><path class="head" d="M670 316 L677 320 L670 324 Z"/>
<text class="small muted" x="30" y="370">A rule names a tool, and can narrow it to a subject or a path.</text>
