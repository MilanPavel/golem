<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" role="img" aria-label="The login, over time, across four lanes: golem web, the page, the gateway, and the daemon. golem web starts the gateway, or reuses the one in run/web.json, and the gateway writes run/web.token with mode 0600 and O_EXCL. golem web opens 127.0.0.1 port 7480 with the token after the hash, which a browser never sends to a server. The page posts the token to /auth/exchange, and gets back 204 with a cookie that holds a fresh secret, not the token. The page removes the hash from the address with replaceState. Then it opens /ws with the cookie, the gateway connects to golem.sock, and the page's hello goes through the bridge to the daemon, which answers and sends the events.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="548" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">THE LOGIN, IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">#t=</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a token, then a cookie</text>
<rect class="box" x="26" y="126" width="128" height="32" rx="2"/><text class="mono" x="90" y="147" font-size="14" text-anchor="middle">golem web</text><path class="edge" d="M90 158 V520"/><rect class="box" x="266" y="126" width="128" height="32" rx="2"/><text class="mono" x="330" y="147" font-size="14" text-anchor="middle">page</text><path class="edge" d="M330 158 V520"/><rect class="box" x="506" y="126" width="128" height="32" rx="2"/><text class="mono" x="570" y="147" font-size="14" text-anchor="middle">gateway</text><path class="edge" d="M570 158 V520"/><rect class="box" x="726" y="126" width="128" height="32" rx="2"/><text class="mono" x="790" y="147" font-size="14" text-anchor="middle">daemon</text><path class="edge" d="M790 158 V520"/><path class="wire" d="M90 188 H569"/><path class="head" d="M563 184 L570 188 L563 192 Z"/><text class="mono small" x="104" y="181">start, or reuse the one in run/web.json</text><path class="wire" d="M90 252 H329"/><path class="head" d="M323 248 L330 252 L323 256 Z"/><text class="mono small" x="104" y="245">open 127.0.0.1:7480/#t=TOKEN</text><path class="wire" d="M330 290 H569"/><path class="head" d="M563 286 L570 290 L563 294 Z"/><text class="mono small" x="344" y="283">POST /auth/exchange {token}</text><path class="wire back" d="M570 322 H331"/><path class="head" d="M337 318 L330 322 L337 326 Z"/><text class="mono small" x="344" y="315">204 Set-Cookie golem_7480=SECRET</text><path class="wire" d="M330 396 H569"/><path class="head" d="M563 392 L570 396 L563 400 Z"/><text class="mono small" x="344" y="389">GET /ws, with the cookie</text><path class="wire" d="M570 428 H789"/><path class="head" d="M783 424 L790 428 L783 432 Z"/><text class="mono small" x="584" y="421">connect golem.sock</text><path class="wire" d="M330 470 H789"/><path class="head" d="M783 466 L790 470 L783 474 Z"/><text class="mono small" x="344" y="463">hello, through the bridge</text><path class="wire back" d="M790 504 H331"/><path class="head" d="M337 500 L330 504 L337 508 Z"/><text class="mono small" x="344" y="497">the reply, then the events</text><rect class="box" x="604" y="202" width="232" height="26" rx="2" style="fill:var(--soft)"/><text class="mono small" x="614" y="219">run/web.token, 0600, O_EXCL</text><rect class="box" x="180" y="340" width="300" height="26" rx="2" style="fill:var(--soft)"/><text class="mono small" x="190" y="357">replaceState: #t= leaves the address</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M90 188 H570" keyTimes="0;0.0400;0.1000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0280;0.0400;0.1000;0.1120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M90 252 H330" keyTimes="0;0.1500;0.2100;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1380;0.1500;0.2100;0.2220;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M330 290 H570" keyTimes="0;0.2600;0.3200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2480;0.2600;0.3200;0.3320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M570 322 H330" keyTimes="0;0.3700;0.4300;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3580;0.3700;0.4300;0.4420;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M330 396 H570" keyTimes="0;0.4800;0.5400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4680;0.4800;0.5400;0.5520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M570 428 H790" keyTimes="0;0.5900;0.6500;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5780;0.5900;0.6500;0.6620;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M330 470 H790" keyTimes="0;0.7000;0.7600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6880;0.7000;0.7600;0.7720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M790 504 H330" keyTimes="0;0.8100;0.8700;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7980;0.8100;0.8700;0.8820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="600" y="198" width="240" height="34" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0880;0.1000;0.1800;0.1920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="176" y="336" width="308" height="34" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4080;0.4200;0.5000;0.5120;1.0000" values="0;0;1;1;0;0"/></rect></g>
</svg>
