<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" role="img" aria-label="golem's terminal app in three packages, from the socket up. @golem/client keeps the link: hello, a ping every 5 seconds, a reconnect that waits from 200 milliseconds up to 5 seconds, and an attach after the last seq it delivered, so a repeat is dropped. @golem/view folds each new event into the chat with reduceChat, and batches deltas for 16 milliseconds. @golem/tui paints the state with Ink and React. The web UI, the next chapter, uses the same view and client over a WebSocket. Real: a window drew 192 deltas as 158 updates, and a late window drew 16 replayed deltas as one. A link dropped at seq 44 was back in 25 milliseconds, attached after 44, and seq 45 came next.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="548" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">THE PACKAGES, IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">3</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a link, a fold, a paint</text>
<rect class="box" x="30" y="130" width="580" height="64" rx="2"/><text class="mono" x="44" y="154" font-size="14">@golem/tui</text><text class="small faint" x="44" y="172">Ink 8 and React 19: the bands, the keys, the layout, painted from the state</text><rect class="box" x="30" y="226" width="580" height="64" rx="2"/><text class="mono" x="44" y="250" font-size="14">@golem/view</text><text class="small faint" x="44" y="268">reduceChat, the 16 ms delta batcher, the composer and its commands, the setup window</text><rect class="box" x="30" y="322" width="580" height="64" rx="2"/><text class="mono" x="44" y="346" font-size="14">@golem/client</text><text class="small faint" x="44" y="364">hello, a ping every 5 s, reconnect from 200 ms up to 5 s, attach after the last seq</text><rect class="box" x="30" y="418" width="580" height="44" rx="2"/><text class="mono" x="44" y="442" font-size="14">golem.sock</text><text class="small faint" x="160" y="446">one JSON line per event, to the daemon</text><path class="wire" d="M320 218 V197"/><path class="head" d="M316 203 L320 196 L324 203 Z"/><path class="wire" d="M320 314 V293"/><path class="head" d="M316 299 L320 292 L324 299 Z"/><path class="wire" d="M320 410 V389"/><path class="head" d="M316 395 L320 388 L324 395 Z"/><text class="small faint" x="332" y="212">the state</text><text class="small faint" x="332" y="308">each new event</text><text class="small faint" x="332" y="404">every event line</text><rect x="650" y="130" width="200" height="64" rx="2" fill="none" class="edge"/><text class="mono" x="664" y="154" font-size="14">@golem/web</text><text class="small faint" x="664" y="172">the browser, chapter 13</text><path class="wire back" d="M750 194 V258 H613"/><path class="head" d="M620 254 L613 258 L620 262 Z"/><path class="wire back" d="M750 258 V354 H613"/><path class="head" d="M620 350 L613 354 L620 358 Z"/><text class="small faint" x="660" y="248">the same fold</text><text class="small faint" x="660" y="344">the same client, over a WebSocket</text><rect class="dot" x="30" y="492" width="6" height="6"/><text x="46" y="500" font-size="14" class="muted">A window drew 192 deltas as 158 updates. A late one drew 16 replayed deltas as one</text><rect class="dot" x="30" y="514" width="6" height="6"/><text x="46" y="522" font-size="14" class="muted">Dropped at seq 44: back in 25 ms, attached after 44, and seq 45 came next</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M320 418 V386" keyTimes="0;0.0400;0.1000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0280;0.0400;0.1000;0.1120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="318" width="588" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0880;0.1000;0.2200;0.2320;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="470" y="346">seq 45 &gt; 44: keep<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0880;0.1000;0.2200;0.2320;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M320 322 V290" keyTimes="0;0.2200;0.2800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2080;0.2200;0.2800;0.2920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="222" width="588" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2680;0.2800;0.4000;0.4120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="470" y="250">fold it<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2680;0.2800;0.4000;0.4120;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M320 226 V194" keyTimes="0;0.4000;0.4600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3880;0.4000;0.4600;0.4720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="126" width="588" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4480;0.4600;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="470" y="154">paint<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4480;0.4600;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M320 418 V386" keyTimes="0;0.6600;0.7200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="318" width="588" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.9000;0.9120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="400" y="346">seq 44 ≤ 44: dropped, a repeat<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.9000;0.9120;1.0000" values="0;0;1;1;0;0"/></text></g>
</svg>
