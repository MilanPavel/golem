<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" role="img" aria-label="How golem's daemon starts. It takes a flock on run/golem.pid for the life of the process. It opens golem.db and checkpoints.db, copying them before a migration, and closes the runs a crash left open. Only then does it unlink a stale golem.sock, bind a new one with mode 0600, and listen. Every 5 seconds it checks that the socket is still its own. When it exits, launchd starts it again after 2 seconds. When the lock is busy, it exits 1 and run/last-error says who holds it. Real: a second start said daemon already running, pid 10406. After kill -9 the socket stayed until the next start. A removed socket stopped the daemon a second later.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="528" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">THE START, IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">0600</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">one daemon per home, one socket</text>
<rect class="box" x="30" y="150" width="180" height="56" rx="2"/><text class="mono" x="44" y="174" font-size="14">flock golem.pid</text><text class="small faint" x="44" y="192">in run/, for life</text><rect class="box" x="236" y="150" width="180" height="56" rx="2"/><text x="250" y="174" font-size="14">open the databases</text><text class="small faint" x="250" y="192">copy, then migrate</text><rect class="box" x="442" y="150" width="180" height="56" rx="2"/><text x="456" y="174" font-size="14">close open runs</text><text class="small faint" x="456" y="192">a crash left them</text><rect class="box" x="648" y="150" width="180" height="56" rx="2"/><text class="mono" x="662" y="174" font-size="14">unlink golem.sock</text><text class="small faint" x="662" y="192">a stale one, if any</text><rect class="box" x="648" y="290" width="180" height="56" rx="2"/><text class="mono" x="662" y="314" font-size="14">bind golem.sock</text><text class="small faint" x="662" y="332">mode 0600, listen</text><rect class="box" x="442" y="290" width="180" height="56" rx="2"/><text x="456" y="314" font-size="14">every 5 s</text><text class="small faint" x="456" y="332">is it still our socket?</text><rect class="box" x="236" y="290" width="180" height="56" rx="2"/><text x="250" y="314" font-size="14">the daemon exits</text><text class="small faint" x="250" y="332">a crash, a stop, gone</text><rect class="box" x="30" y="290" width="180" height="56" rx="2"/><text x="44" y="314" font-size="14">launchd</text><text class="small faint" x="44" y="332">KeepAlive, after 2 s</text><path class="wire" d="M210 178 H235"/><path class="head" d="M229 174 L236 178 L229 182 Z"/><path class="wire" d="M416 178 H441"/><path class="head" d="M435 174 L442 178 L435 182 Z"/><path class="wire" d="M622 178 H647"/><path class="head" d="M641 174 L648 178 L641 182 Z"/><path class="wire" d="M738 206 V287"/><path class="head" d="M734 281 L738 288 L742 281 Z"/><path class="wire" d="M648 318 H623"/><path class="head" d="M629 314 L622 318 L629 322 Z"/><path class="wire" d="M442 318 H417"/><path class="head" d="M423 314 L416 318 L423 322 Z"/><path class="wire" d="M236 318 H211"/><path class="head" d="M217 314 L210 318 L217 322 Z"/><path class="wire" d="M120 290 V209"/><path class="head" d="M116 216 L120 209 L124 216 Z"/><text class="small faint" x="130" y="256">starts it again</text><path class="wire back" d="M30 178 H14 V392 H28"/><path class="head" d="M21 388 L28 392 L21 396 Z"/><rect class="box" x="30" y="372" width="820" height="40" rx="2"/><text class="mono small" x="44" y="396">lock busy: exit 1, and run/last-error says who holds it and how to stop it</text><rect class="dot" x="30" y="438" width="6" height="6"/><text x="46" y="446" font-size="14" class="muted">A second start, real: daemon already running (pid 10406), exit 1</text><rect class="dot" x="30" y="460" width="6" height="6"/><text x="46" y="468" font-size="14" class="muted">After kill -9, golem.sock stays behind until the next start removes it</text><rect class="dot" x="30" y="482" width="6" height="6"/><text x="46" y="490" font-size="14" class="muted">rm golem.sock at 19:56:48: the daemon logged is gone; stopping at 19:56:49</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M120 178 H738 V318 H120 V210" keyTimes="0;0.0400;0.7200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0280;0.0400;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="146" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0280;0.0400;0.1200;0.1320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="232" y="146" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1080;0.1200;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="438" y="146" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1880;0.2000;0.2800;0.2920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="644" y="146" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2680;0.2800;0.3600;0.3720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="644" y="286" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3480;0.3600;0.4600;0.4720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="438" y="286" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4480;0.4600;0.5600;0.5720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="232" y="286" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5480;0.5600;0.6300;0.6420;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="286" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6180;0.6300;0.7000;0.7120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="250" y="282">kill -9<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5480;0.5600;0.6600;0.6720;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="26" y="368" width="828" height="48" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7480;0.7600;0.9400;0.9520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M30 178 H14 V392 H28" keyTimes="0;0.7200;0.7800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.7800;0.7920;1.0000" values="0;0;1;1;0;0"/></rect></g>
</svg>
