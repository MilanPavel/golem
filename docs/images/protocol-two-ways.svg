<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" role="img" aria-label="The two directions of a protocol between a client and an agent. A command has an id and gets one reply with the same id. Events are facts, in order, each with a number, and get no reply. When the connection drops, the client asks for everything after the last number it has, number 41, and gets 42 again and then 43.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="496" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">2 ways</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">commands ask, events tell</text>
<text class="mono label" x="250" y="146" text-anchor="middle">A CLIENT</text><text class="mono label" x="720" y="146" text-anchor="middle">THE AGENT</text><path class="wire" d="M250 156 V440"/><path class="wire" d="M720 156 V440"/><text class="small faint" x="732" y="290">keeps every</text><text class="small faint" x="732" y="306">event, numbered</text><path d="M232 314 L268 340 M268 314 L232 340" style="stroke:var(--clay);stroke-width:2"/><text class="small muted" x="30" y="332">the connection drops</text><path class="wire" d="M250 176 H719"/><path class="head" d="M713 172 L720 176 L713 180 Z"/><text class="mono small" x="485" y="170" text-anchor="middle">{"id":4, "method":"send", …}</text><text class="small muted" x="30" y="180">a command asks</text><path class="wire" d="M720 206 H251"/><path class="head" d="M257 202 L250 206 L257 210 Z"/><text class="mono small" x="485" y="200" text-anchor="middle">{"id":4, "result":{"run":"r_7"}}</text><text class="small muted" x="30" y="210">and gets one reply</text><path class="wire" d="M720 246 H251"/><path class="head" d="M257 242 L250 246 L257 250 Z"/><text class="mono small" x="485" y="240" text-anchor="middle">event #41  a token</text><text class="small muted" x="30" y="250">events tell, in order,</text><path class="wire" d="M720 272 H251"/><path class="head" d="M257 268 L250 272 L257 276 Z"/><text class="mono small" x="485" y="266" text-anchor="middle">event #42  a token</text><text class="small muted" x="30" y="276">numbered, with no reply</text><path class="wire" d="M250 370 H719"/><path class="head" d="M713 366 L720 370 L713 374 Z"/><text class="mono small" x="485" y="364" text-anchor="middle">attach, after #41</text><text class="small muted" x="30" y="374">it asks from its number</text><path class="wire back" d="M720 400 H251"/><path class="head" d="M257 396 L250 400 L257 404 Z"/><text class="mono small" x="485" y="394" text-anchor="middle">event #42  again</text><text class="small muted" x="30" y="404">and the rest comes again</text><path class="wire" d="M720 426 H251"/><path class="head" d="M257 422 L250 426 L257 430 Z"/><text class="mono small" x="485" y="420" text-anchor="middle">event #43  done</text>
<text class="small muted" x="30" y="470">A number on each event is what makes a reconnect lose nothing and repeat nothing.</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M250 176 H720" keyTimes="0;0.0300;0.1100;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.1100;0.1220;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M720 206 H250" keyTimes="0;0.1200;0.2000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1080;0.1200;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M720 246 H250" keyTimes="0;0.2400;0.3200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2280;0.2400;0.3200;0.3320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M720 272 H250" keyTimes="0;0.3200;0.4000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3080;0.3200;0.4000;0.4120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M250 370 H720" keyTimes="0;0.5800;0.6600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5680;0.5800;0.6600;0.6720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M720 400 H250" keyTimes="0;0.7000;0.7800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6880;0.7000;0.7800;0.7920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M720 426 H250" keyTimes="0;0.7800;0.8600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7680;0.7800;0.8600;0.8720;1.0000" values="0;0;1;1;0;0"/></rect><path d="M232 314 L268 340 M268 314 L232 340" style="stroke:var(--clay);stroke-width:4" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4280;0.4400;0.5600;0.5720;1.0000" values="0;0;1;1;0;0"/></path><rect class="lit" x="712" y="160" width="16" height="280" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6080;0.6200;0.7000;0.7120;1.0000" values="0;0;1;1;0;0"/></rect></g>
</svg>
