<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 594" role="img" aria-label="Inside the page, from the gateway's /ws up. @golem/client, the same client the TUI uses, runs over wsDial: hello, the ping, the reconnect, seq order, and repeats dropped. It feeds three kinds of state. Session events go to session stores, one per attached session, folded by reduceChat from @golem/view, with deltas folded once per frame. Live facts go to the live store: the link, the session list, downloads, and server status, pushed and never stored. Replies go to TanStack Query: model.list, skill.list, and the rest, pulled with a request and marked stale when a pushed event says so. The screens in features and ui read from all three. A hidden tab runs no frames, so any other event folds the waiting deltas first. There are no optimistic updates: your line appears when message.completed comes back.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="594" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">INSIDE THE PAGE, IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">3</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">kinds of state, one client</text>
<rect class="box" x="30" y="130" width="820" height="56" rx="2"/><text class="mono" x="44" y="154" font-size="14">features/ and ui/</text><text class="small faint" x="44" y="172">the screens and their primitives: React 19, Radix, Tailwind with golem's tokens only</text><rect class="box" x="30" y="236" width="260" height="92" rx="2"/><text class="mono" x="44" y="260" font-size="14">session stores</text><text class="small faint" x="44" y="278">one per attached session</text><text class="small faint" x="44" y="296">reduceChat from @golem/view</text><text class="small faint" x="44" y="314">deltas fold once per frame</text><rect class="box" x="310" y="236" width="260" height="92" rx="2"/><text class="mono" x="324" y="260" font-size="14">live store</text><text class="small faint" x="324" y="278">pushed, never stored</text><text class="small faint" x="324" y="296">the link, the session list</text><text class="small faint" x="324" y="314">downloads, server status</text><rect class="box" x="590" y="236" width="260" height="92" rx="2"/><text class="mono" x="604" y="260" font-size="14">TanStack Query</text><text class="small faint" x="604" y="278">pulled: a request, a reply</text><text class="small faint" x="604" y="296">model.list, skill.list, …</text><text class="small faint" x="604" y="314">stale when an event says so</text><rect class="box" x="30" y="378" width="820" height="56" rx="2"/><text class="mono" x="44" y="402" font-size="14">@golem/client</text><text class="small faint" x="44" y="420">the TUI's client, over wsDial: hello, the ping, the reconnect, seq order, repeats dropped</text><rect class="box" x="30" y="470" width="820" height="40" rx="2"/><text class="mono" x="44" y="494" font-size="14">the gateway's /ws</text><path class="wire" d="M160 376 V331"/><path class="head" d="M156 337 L160 330 L164 337 Z"/><path class="wire" d="M160 234 V189"/><path class="head" d="M156 195 L160 188 L164 195 Z"/><path class="wire" d="M440 376 V331"/><path class="head" d="M436 337 L440 330 L444 337 Z"/><path class="wire" d="M440 234 V189"/><path class="head" d="M436 195 L440 188 L444 195 Z"/><path class="wire" d="M720 376 V331"/><path class="head" d="M716 337 L720 330 L724 337 Z"/><path class="wire" d="M720 234 V189"/><path class="head" d="M716 195 L720 188 L724 195 Z"/><path class="wire" d="M440 468 V437"/><path class="head" d="M436 443 L440 436 L444 443 Z"/><text class="small faint" x="172" y="360">session events</text><text class="small faint" x="452" y="360">live facts</text><text class="small faint" x="732" y="360">replies</text><path class="wire back" d="M570 282 H589"/><path class="head" d="M582 278 L589 282 L582 286 Z"/><text class="small faint" x="580" y="226" text-anchor="middle">invalidates</text><rect class="dot" x="30" y="540" width="6" height="6"/><text x="46" y="548" font-size="14" class="muted">A hidden tab runs no frames, so any other event folds the waiting deltas first</text><rect class="dot" x="30" y="562" width="6" height="6"/><text x="46" y="570" font-size="14" class="muted">No optimistic updates: your line appears when message.completed comes back</text>
