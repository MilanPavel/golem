de="linear" path="M467 380 H212" keyTimes="0;0.6400;0.7200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6280;0.6400;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="314" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="226" y="250">a new window: after #3<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7880;0.8000;0.9850;0.9970;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M467 212 H212" keyTimes="0;0.8000;0.8800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7880;0.8000;0.8800;0.8920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="162" width="188" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8680;0.8800;0.9600;0.9720;1.0000" values="0;0;1;1;0;0"/></rect></g>
