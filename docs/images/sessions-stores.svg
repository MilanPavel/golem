<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 492" role="img" aria-label="What survives. A window draws the events, and the agent runs each turn, but both live in a process and are gone after a close or a crash. Each turn is written first to two files on disk: the event log, what was shown, numbered, and the checkpoint, what the model reads next. The window closes and the agent keeps writing. Then the agent crashes. A new process reads the checkpoint, and a new window reads the log after the last number it had.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="492" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">on disk</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">outlives the window and the process</text>
<text class="mono label" x="30" y="146">IN A PROCESS: GONE ON A CRASH</text><text class="mono label" x="470" y="146">ON DISK: KEPT</text><path class="edge" d="M440 150 V430"/><rect class="box" x="30" y="166" width="180" height="56" rx="2"/><text x="44" y="190" font-size="14">a window</text><text class="small faint" x="44" y="208">draws what happened</text><rect class="box" x="30" y="318" width="180" height="56" rx="2"/><text x="44" y="342" font-size="14">the agent</text><text class="small faint" x="44" y="360">runs each turn</text><path class="wire back" d="M120 318 V229"/><path class="head" d="M116 236 L120 229 L124 236 Z"/><text class="small faint" x="130" y="276">events</text><rect class="box" x="470" y="166" width="380" height="132" rx="2"/><text x="484" y="190" font-size="14">the event log</text><text class="small faint" x="590" y="190">what was shown, numbered</text><rect class="box" x="470" y="318" width="380" height="112" rx="2"/><text x="484" y="342" font-size="14">the checkpoint</text><text class="small faint" x="594" y="342">what the model reads next</text><path class="wire" d="M210 334 H420 V232 H467"/><path class="head" d="M460 228 L467 232 L460 236 Z"/><path class="wire" d="M210 358 H467"/><path class="head" d="M460 354 L467 358 L460 362 Z"/><text class="small faint" x="226" y="350">written first</text><text class="mono small muted" x="484" y="212">#1  you: tell me a story</text><text class="mono small muted" x="484" y="230">#2  answer started</text><text class="mono small muted" x="484" y="248">#3  answer done: Once, a golem…</text><text class="mono small muted" x="484" y="266">#4  you: go on</text><text class="mono small muted" x="484" y="284">#5  answer done: That night…</text><text class="mono small muted" x="484" y="364">user: tell me a story</text><text class="mono small muted" x="484" y="382">assistant: Once, a golem…</text><text class="mono small muted" x="484" y="400">user: go on</text><text class="mono small muted" x="484" y="418">assistant: That night…</text>
<text class="small muted" x="30" y="466">The window can close and the process can die. A new one starts from the two files, not from scratch.</text>
