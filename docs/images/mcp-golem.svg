ect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M260 272 H125 V336" keyTimes="0;0.3400;0.4000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3280;0.3400;0.4000;0.4120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="334" width="198" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3880;0.4000;0.4800;0.4920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M220 366 H258" keyTimes="0;0.4600;0.4900;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4480;0.4600;0.4900;0.5020;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="256" y="334" width="238" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4780;0.4900;0.6600;0.6720;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="375" y="326" text-anchor="middle">approval.needed → you allow<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5080;0.5200;0.6600;0.6720;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M490 366 H688" keyTimes="0;0.6600;0.7200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="686" y="146" width="168" height="252" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.7800;0.7920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M770 394 V430 H125 V401" keyTimes="0;0.7800;0.9000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7680;0.7800;0.9000;0.9120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="26" y="334" width="198" height="64" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8880;0.9000;0.9800;0.9920;1.0000" values="0;0;1;1;0;0"/></rect></g>
