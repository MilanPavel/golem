<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 492" role="img" aria-label="One MCP call in golem. The supervisor starts the tracker server from config.toml, and initializes and lists it. The session's scoped registry gives the model mcp__tracker__list_issues. When the model calls it, the tools node asks, because the built-in default for an MCP tool is ask. After you allow it, tools/call goes to the server, and the output comes back inside mcp_output, marked as data.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="492" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE CALL IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">asks first</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">every MCP tool, every call</text>
<rect class="box" x="30" y="150" width="190" height="56" rx="2"/><text class="mono" x="44" y="175.0" font-size="13">[mcp.tracker]</text><text class="small faint" x="44" y="192.0">in ~/.golem/config.toml</text><path class="wire" d="M220 178 H256"/><path class="head" d="M250 174 L257 178 L250 182 Z"/><rect class="box" x="260" y="150" width="230" height="56" rx="2"/><text class="mono" x="274" y="175.0" font-size="13">McpSupervisor</text><text class="small faint" x="274" y="192.0">starts it, pings it every 30 s</text><path class="wire" d="M490 178 H687"/><path class="head" d="M680 174 L687 178 L680 182 Z"/><text class="mono small" x="588" y="170" text-anchor="middle">initialize · tools/list</text><rect class="box" x="690" y="150" width="160" height="244" rx="2"/><text class="mono" x="704" y="176" font-size="13">tracker</text><text class="small faint" x="704" y="194">a child process, stdio</text><text class="small faint" x="704" y="212">list_issues, create_issue</text><path class="wire" d="M375 206 V243"/><path class="head" d="M371 237 L375 244 L379 237 Z"/><rect class="box" x="260" y="246" width="230" height="52" rx="2"/><text class="mono" x="274" y="269.0" font-size="13">ToolRegistry.scoped</text><text class="small faint" x="274" y="286.0">this session's tools</text><path class="wire" d="M260 272 H125 V336"/><path class="head" d="M121 329 L125 336 L129 329 Z"/><rect class="box" x="30" y="338" width="190" height="56" rx="2"/><text class="mono" x="44" y="363.0" font-size="13">the model</text><text class="small faint" x="44" y="380.0">mcp__tracker__list_issues</text><path class="wire" d="M220 366 H256"/><path class="head" d="M250 362 L257 366 L250 370 Z"/><rect class="box" x="260" y="338" width="230" height="56" rx="2"/><text class="mono" x="274" y="363.0" font-size="13">tools node</text><text class="small faint" x="274" y="380.0">built-in default: ask</text><path class="wire" d="M490 366 H687"/><path class="head" d="M680 362 L687 366 L680 370 Z"/><text class="mono small" x="588" y="358" text-anchor="middle">tools/call</text><path class="wire back" d="M770 394 V430 H125 V401"/><path class="head" d="M121 408 L125 401 L129 408 Z"/><text class="small faint" x="448" y="424" text-anchor="middle">the output, inside &lt;mcp_output&gt;, marked as data</text>
<text class="small muted" x="30" y="466">Real, from one run with qwen3-coder:30b: seq 6 asks, seq 8 allows, seq 10 is the result.</text>
