<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" role="img" aria-label="An approval in golem: the tools node calls interrupt() at the first call that asks, and the run waits with no task in memory, so it survives a daemon restart. Your answer is approval.respond. The node then runs again from its first line, earlier answers come back, and only then do the allowed calls run.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="388" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE APPROVAL IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">0 tasks</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">while the run waits for you</text>
<rect class="box" x="30" y="150" width="156" height="110" rx="2"/><text class="mono label" x="44" y="174">1 · ASK</text><text x="44" y="202" font-size="14">interrupt()</text><text x="44" y="222" font-size="13" class="muted">at the first call</text><text x="44" y="240" font-size="13" class="muted">that asks</text><rect class="box" x="196" y="150" width="156" height="110" rx="2"/><text class="mono label" x="210" y="174">2 · WAIT</text><text x="210" y="202" font-size="14">run: waiting</text><text x="210" y="222" font-size="13" class="muted">no task in memory</text><text x="210" y="240" font-size="13" class="muted">survives a restart</text><rect class="box" x="362" y="150" width="156" height="110" rx="2"/><text class="mono label" x="376" y="174">3 · ANSWER</text><text x="376" y="202" font-size="14">a · s · w · e · d</text><text x="376" y="222" font-size="13" class="muted">approval.respond</text><text x="376" y="240" font-size="13" class="muted"></text><rect class="box" x="528" y="150" width="156" height="110" rx="2"/><text class="mono label" x="542" y="174">4 · RESUME</text><text x="542" y="202" font-size="14">the node again,</text><text x="542" y="222" font-size="13" class="muted">from its first line</text><text x="542" y="240" font-size="13" class="muted">old answers return</text><rect class="box" x="694" y="150" width="156" height="110" rx="2"/><text class="mono label" x="708" y="174">5 · RUN</text><text x="708" y="202" font-size="14">only now, the</text><text x="708" y="222" font-size="13" class="muted">allowed calls run</text><text x="708" y="240" font-size="13" class="muted">one by one</text><path class="wire" d="M186 205 H194"/><path class="head" d="M188 201 L195 205 L188 209 Z"/><path class="wire" d="M352 205 H360"/><path class="head" d="M354 201 L361 205 L354 209 Z"/><path class="wire" d="M518 205 H526"/><path class="head" d="M520 201 L527 205 L520 209 Z"/><path class="wire" d="M684 205 H692"/><path class="head" d="M686 201 L693 205 L686 209 Z"/><text class="mono label" x="30" y="300">ON THE WIRE</text><text class="mono small" x="30" y="324">tool.requested · approval.needed</text><text class="mono small" x="362" y="324">approval.resolved</text><text class="mono small" x="528" y="324">tool.started · tool.completed</text><text class="small muted" x="30" y="364">Nothing runs, and no event is sent, before the last answer. So a resume repeats nothing.</text>
<g class="anim"><rect class="lit" x="26" y="146" width="164" height="118" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.1500;0.1620;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M186 205 H196" keyTimes="0;0.1700;0.2000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1580;0.1700;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="192" y="146" width="164" height="118" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1880;0.2000;0.5000;0.5120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M352 205 H362" keyTimes="0;0.3400;0.3700;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3280;0.3400;0.3700;0.3820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="358" y="146" width="164" height="118" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3580;0.3700;0.4900;0.5020;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M518 205 H528" keyTimes="0;0.5100;0.5400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4980;0.5100;0.5400;0.5520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="524" y="146" width="164" height="118" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5280;0.5400;0.6600;0.6720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-3.5" y="-3.5" width="7" height="7" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M684 205 H694" keyTimes="0;0.6800;0.7100;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6680;0.6800;0.7100;0.7220;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="690" y="146" width="164" height="118" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6980;0.7100;0.8300;0.8420;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="274" y="282" text-anchor="middle">the daemon restarts<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2480;0.2600;0.3400;0.3520;1.0000" values="0;0;1;1;0;0"/></text></g>
</svg>
