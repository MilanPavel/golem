<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 504" role="img" aria-label="Five clients reach one daemon. The terminal uses the Unix socket as today. The browser, the Mac app, the iPhone, and your app each come through a door of the gateway inside the golem binary: loopback with a token, Wi-Fi, Tailscale or a relay, and HTTPS with an API key. The daemon speaks only the golem protocol, with no ports, TLS, or logins.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="504" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE DAEMON, ONE PROTOCOL</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">many doors</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">every network door is the gateway</text>
<text class="mono label" x="30" y="140" text-anchor="start">CLIENTS</text><text class="mono label" x="300" y="196" text-anchor="start">GATEWAY · INSIDE THE GOLEM BINARY</text><text class="mono label" x="600" y="132" text-anchor="start">DAEMON</text><rect class="box" x="300" y="206" width="230" height="230" rx="6"/><rect class="box" x="600" y="144" width="250" height="292" rx="6"/><g shape-rendering="crispEdges"><rect x="713" y="186" width="8" height="8" fill="var(--clay)"/><rect x="721" y="186" width="8" height="8" fill="var(--clay)"/><rect x="729" y="186" width="8" height="8" fill="var(--clay)"/><rect x="705" y="194" width="8" height="8" fill="var(--clay)"/><rect x="713" y="194" width="8" height="8" fill="var(--ink)"/><rect x="721" y="194" width="8" height="8" fill="var(--clay)"/><rect x="729" y="194" width="8" height="8" fill="var(--ink)"/><rect x="737" y="194" width="8" height="8" fill="var(--clay)"/><rect x="689" y="202" width="8" height="8" fill="var(--clay)"/><rect x="697" y="202" width="8" height="8" fill="var(--clay)"/><rect x="705" y="202" width="8" height="8" fill="var(--clay)"/><rect x="713" y="202" width="8" height="8" fill="var(--clay)"/><rect x="721" y="202" width="8" height="8" fill="var(--clay)"/><rect x="729" y="202" width="8" height="8" fill="var(--clay)"/><rect x="737" y="202" width="8" height="8" fill="var(--clay)"/><rect x="745" y="202" width="8" height="8" fill="var(--clay)"/><rect x="753" y="202" width="8" height="8" fill="var(--clay)"/><rect x="689" y="210" width="8" height="8" fill="var(--clay)"/><rect x="705" y="210" width="8" height="8" fill="var(--clay)"/><rect x="713" y="210" width="8" height="8" fill="var(--clay)"/><rect x="721" y="210" width="8" height="8" fill="var(--clay)"/><rect x="729" y="210" width="8" height="8" fill="var(--clay)"/><rect x="737" y="210" width="8" height="8" fill="var(--clay)"/><rect x="753" y="210" width="8" height="8" fill="var(--clay)"/><rect x="689" y="218" width="8" height="8" fill="var(--clay)"/><rect x="705