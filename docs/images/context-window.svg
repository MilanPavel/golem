<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" role="img" aria-label="Three calls in one chat. Each call sends the whole context again: the system prompt, the tool list, the history so far, and the new message. The history grows from none to two to four messages, toward the window's limit.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="472" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">every call</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">the whole context, sent again</text>
<text class="mono label" x="30" y="150">IN EVERY CALL</text><rect x="30" y="170" width="18" height="18" rx="2" fill="var(--soft)" stroke="var(--line)"/><text x="60" y="184" font-size="14">system prompt</text><text class="small faint" x="60" y="201">who it is, its rules</text><rect x="30" y="220" width="18" height="18" rx="2" fill="var(--sunken)" stroke="var(--line)"/><text x="60" y="234" font-size="14">tool list</text><text class="small faint" x="60" y="251">each tool's name and schema</text><rect x="30" y="270" width="18" height="18" rx="2" fill="var(--surface)" stroke="var(--line)"/><text x="60" y="284" font-size="14">history</text><text class="small faint" x="60" y="301">every message so far</text><rect x="30" y="320" width="18" height="18" rx="2" fill="var(--surface)" stroke="var(--clay)"/><text x="60" y="334" font-size="14">your message</text><text class="small faint" x="60" y="351">the new turn</text><path class="edge" d="M290 150 H830"/><text class="small faint" x="830" y="142" text-anchor="end">the window's limit</text><rect x="300" y="282" width="150" height="34" fill="var(--soft)" stroke="var(--line)"/><text class="small muted" x="375.0" y="303.0" text-anchor="middle">system</text><rect x="300" y="316" width="150" height="40" fill="var(--sunken)" stroke="var(--line)"/><text class="small muted" x="375.0" y="340.0" text-anchor="middle">tools</text><rect x="300" y="356" width="150" height="28" fill="var(--surface)" stroke="var(--clay)"/><text class="small muted" x="375.0" y="374.0" text-anchor="middle">message</text><text class="mono label" x="375.0" y="408" text-anchor="middle">CALL 1</text><rect x="480" y="222" width="150" height="34" fill="var(--soft)" stroke="var(--line)"/><text class="small muted" x="555.0" y="243.0" text-anchor="middle">system</text><rect x="480" y="256" width="150" height="40" fill="var(--sunken)" stroke="var(--line)"/><text class="small muted" x="555.0" y="280.0" text-anchor="middle">tools</text><rect x="480" y="296" width="150" height="60" fill="var(--surface)" stroke="var(--line)"/><text class="small muted" x="555.0" y="330.0" text-anchor="middle">2 messages</text><rect x="480" y="356" width="150" height="28" fill="var(--surface)" stroke="var(--clay)"/><text class="small muted" x="555.0" y="374.0" text-anchor="middle">message</text><text class="mono label" x="555.0" y="408" text-anchor="middle">CALL 2</text><rect x="660" y="158" width="150" height="34" fill="var(--soft)" stroke="var(--line)"/><text class="small muted" x="735.0" y="179.0" text-anchor="middle">system</text><rect x="660" y="192" width="150" height="40" fill="var(--sunken)" stroke="var(--line)"/><text class="small muted" x="735.0" y="216.0" text-anchor="middle">tools</text><rect x="660" y="232" width="150" height="124" fill="var(--surface)" stroke="var(--line)"/><text class="small muted" x="735.0" y="298.0" text-anchor="middle">4 messages</text><rect x="660" y="356" width="150" height="28" fill="var(--surface)" stroke="var(--clay)"/><text class="small muted" x="735.0" y="374.0" text-anchor="middle">message</text><text class="mono label" x="735.0" y="408" text-anchor="middle">CALL 3</text>
<text class="small muted" x="30" y="446">Nothing carries over between calls. Each one sends it all again, and the history grows toward the limit.</text>
<g class="anim"><rect class="lit" x="297" y="279" width="156" height="40" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0280;0.0400;0.0900;0.1020;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="297" y="313" width="156" height="46" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0630;0.0750;0.1250;0.1370;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="297" y="353" width="156" height="34" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1330;0.1450;0.1950;0.2070;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="295" y="277" width="160" height="112" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1780;0.1900;0.3300;0.3420;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="375.0" y="270" text-anchor="middle">→ the model<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1780;0.1900;0.3300;0.3420;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="477" y="219" width="156" height="40" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3480;0.3600;0.4100;0.4220;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="477" y="253" width="156" height="46" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3830;0.3950;0.4450;0.4570;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="477" y="293" width="156" height="66" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4180;0.4300;0.4800;0.4920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="477" y="353" width="156" height="34" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4530;0.4650;0.5150;0.5270;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="475" y="217" width="160" height="172" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4980;0.5100;0.6500;0.6620;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="555.0" y="210" text-anchor="middle">→ the model<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4980;0.5100;0.6500;0.6620;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="657" y="155" width="156" height="40" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6680;0.6800;0.7300;0.7420;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="657" y="189" width="156" height="46" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7030;0.7150;0.7650;0.7770;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="657" y="229" width="156" height="130" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7380;0.7500;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="657" y="353" width="156" height="34" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7730;0.7850;0.8350;0.8470;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="655" y="153" width="160" height="236" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8180;0.8300;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="735.0" y="146" text-anchor="middle">→ the model<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8180;0.8300;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></text></g>
</svg>
