<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" role="img" aria-label="Why an agent runs apart from its windows. Inside the window, the chat, the model calls, and the tools are all in one terminal's process: close it, and the work stops with it. Apart, a background process holds the work, and a terminal, a browser tab, and later a timer attach to it. One window closes and the others and the work go on. Opened again, it catches up.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="458" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">apart</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">the work outlives every window</text>
<text class="mono label" x="30" y="140">INSIDE THE WINDOW</text><text class="mono label" x="470" y="140">APART FROM THE WINDOWS</text><path class="edge" d="M440 146 V404"/><rect class="box" x="30" y="160" width="380" height="176" rx="2"/><text x="44" y="184" font-size="14">a terminal</text><rect x="54" y="204" width="332" height="108" rx="2" fill="var(--soft)"/><text x="70" y="230" font-size="14">the agent</text><text class="small faint" x="70" y="250">the chat, the model calls, the tools</text><text class="small faint" x="70" y="268">all in this one process</text><text class="small muted" x="30" y="392">Close it, and the work stops with it.</text><rect class="box" x="700" y="200" width="150" height="120" rx="2" style="fill:var(--soft)"/><text x="714" y="226" font-size="14">the agent</text><text class="small faint" x="714" y="244">a background</text><text class="small faint" x="714" y="260">process</text><text class="small muted" x="470" y="392">Close one, and the others and the work go on.</text><rect class="box" x="470" y="160" width="150" height="52" rx="2"/><text x="484" y="184" font-size="14">a terminal</text><path class="wire" d="M620 186 H660 V260 H697"/><rect class="box" x="470" y="232" width="150" height="52" rx="2"/><text x="484" y="256" font-size="14">a browser tab</text><path class="wire" d="M620 258 H660 V260 H697"/><rect class="box" x="470" y="304" width="150" height="52" rx="2"/><text x="484" y="328" font-size="14">a timer, later</text><path class="wire" d="M620 330 H660 V260 H697"/><path class="head" d="M690 256 L697 260 L690 264 Z"/>
<text class="small muted" x="30" y="432">Apart means two programs, and a language between them: the next chapter.</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M70 290 H370" keyTimes="0;0.0300;0.2000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><rect x="30" y="160" width="380" height="176" rx="2" fill="var(--sunken)" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2280;0.2400;0.6200;0.6320;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="44" y="188">closed: the chat is gone<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2280;0.2400;0.6200;0.6320;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M697 260 H660 V186 H621" keyTimes="0;0.0600;0.1400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0480;0.0600;0.1400;0.1520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M697 260 H660 V258 H621" keyTimes="0;0.0600;0.1400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0480;0.0600;0.1400;0.1520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M697 260 H660 V330 H621" keyTimes="0;0.0600;0.1400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0480;0.0600;0.1400;0.1520;1.0000" values="0;0;1;1;0;0"/></rect><rect x="470" y="160" width="150" height="52" rx="2" fill="var(--sunken)" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2280;0.2400;0.6200;0.6320;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="484" y="188">closed<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2280;0.2400;0.6200;0.6320;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M697 260 H660 V258 H621" keyTimes="0;0.3000;0.3800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2880;0.3000;0.3800;0.3920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M697 260 H660 V330 H621" keyTimes="0;0.3000;0.3800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2880;0.3000;0.3800;0.3920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="696" y="196" width="158" height="128" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3680;0.3800;0.5000;0.5120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="700" y="344">still running<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3680;0.3800;0.9850;0.9970;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="466" y="156" width="158" height="60" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="484" y="202">opened again: catches up<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.9850;0.9970;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M697 260 H660 V186 H621" keyTimes="0;0.7000;0.8000;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6880;0.7000;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect></g>
