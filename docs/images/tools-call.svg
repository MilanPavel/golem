<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" role="img" aria-label="A tool call: the program offers a list of tools, the model writes a call with a name and arguments, the program runs it and sends back the result. When a call fails, the error goes back as its result, and the model can try again.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="432" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">1 call</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a name and arguments, written as text</text>
<rect x="20" y="130" width="840" height="196" rx="3" fill="var(--soft)"/>
<rect class="box" x="30" y="150" width="260" height="160" rx="2"/><text class="mono label" x="46" y="174">TOOLS OFFERED</text><text class="mono" x="46" y="202" font-size="14">grep</text><text x="46" y="220" font-size="13" class="muted">search the files</text><text class="mono small faint" x="46" y="238">pattern: string</text><text class="mono" x="46" y="266" font-size="14">todo_write</text><text x="46" y="284" font-size="13" class="muted">keep a todo list</text><text class="mono small faint" x="46" y="302">todos: one in_progress</text><rect class="box" x="350" y="198" width="160" height="64" rx="2"/><text x="430" y="235" text-anchor="middle" font-size="18">Model</text><rect class="box" x="574" y="150" width="276" height="160" rx="2"/><text class="mono label" x="590" y="174">THE PROGRAM</text><text class="mono small faint" x="590" y="204">call</text><text class="mono small faint" x="590" y="258">result</text><path class="wire" d="M290 230 H346"/><path class="head" d="M340 226 L347 230 L340 234 Z"/><text class="mono label" x="320" y="220" text-anchor="middle" font-size="11">LIST</text><path class="wire" d="M510 214 H570"/><path class="head" d="M564 210 L571 214 L564 218 Z"/><text class="mono label" x="542" y="204" text-anchor="middle" font-size="11">CALL</text><path class="wire back" d="M574 246 H514"/><path class="head" d="M520 242 L513 246 L520 250 Z"/><text class="mono label" x="542" y="266" text-anchor="middle" font-size="11">RESULT</text>
<rect class="dot" x="40" y="354" width="6" height="6"/><text x="56" y="362" font-size="14" class="muted">the model only writes the call</text><rect class="dot" x="40" y="376" width="6" height="6"/><text x="56" y="384" font-size="14" class="muted">the program checks it, and runs it</text><rect class="dot" x="40" y="398" width="6" height="6"/><text x="56" y="406" font-size="14" class="muted">a failure is a result too</text>
<g class="anim"><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M290 230 H348" keyTimes="0;0.0200;0.0800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0080;0.0200;0.0800;0.0920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="346" y="194" width="168" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0680;0.0800;0.1600;0.1720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="38" y="184" width="244" height="58" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0880;0.1000;0.3000;0.3120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M510 214 H572" keyTimes="0;0.1600;0.2200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1480;0.1600;0.2200;0.2320;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono" x="590" y="226" font-size="13">grep(pattern="TODO")<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2080;0.2200;0.4600;0.4720;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="570" y="146" width="284" height="168" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2080;0.2200;0.3000;0.3120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small" x="590" y="280">notes.txt:3: TODO: changelog<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2880;0.3000;0.4600;0.4720;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M574 246 H512" keyTimes="0;0.3000;0.3600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2880;0.3000;0.3600;0.3720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="346" y="194" width="168" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3480;0.3600;0.4400;0.4520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M290 230 H348" keyTimes="0;0.5200;0.5800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5080;0.5200;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="346" y="194" width="168" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5680;0.5800;0.6600;0.6720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="38" y="248" width="244" height="58" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5880;0.6000;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M510 214 H572" keyTimes="0;0.6600;0.7200;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6480;0.6600;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono" x="590" y="226" font-size="13">todo_write(both in_progress)<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.9600;0.9720;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="570" y="146" width="284" height="168" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="590" y="280">error: one in_progress at a time<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7880;0.8000;0.9600;0.9720;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M574 246 H512" keyTimes="0;0.8000;0.8600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7880;0.8000;0.8600;0.8720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="346" y="194" width="168" height="72" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8480;0.8600;0.9400;0.9520;1.0000" values="0;0;1;1;0;0"/></rect></g>
</svg>
