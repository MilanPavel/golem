<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" role="img" aria-label="Why a standard. Without one, each of three agents writes its own glue for each of four services: twelve integrations. With MCP, each agent has one client and each service one server, and they all speak the same protocol: seven pieces, and any client works with any server.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="458" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">12 → 7</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">integrations, for 3 agents and 4 services</text>
<text class="mono label" x="30" y="146">WITHOUT A STANDARD</text><text class="mono label" x="470" y="146">WITH MCP</text><path class="edge" d="M440 150 V390"/><rect class="box" x="30" y="172" width="124" height="36" rx="2"/><text x="42" y="195" font-size="13">a coding agent</text><path class="wire" d="M154 190 L290 172"/><path class="wire" d="M154 190 L290 226"/><path class="wire" d="M154 190 L290 280"/><path class="wire" d="M154 190 L290 334"/><rect class="box" x="30" y="242" width="124" height="36" rx="2"/><text x="42" y="265" font-size="13">a chat app</text><path class="wire" d="M154 260 L290 172"/><path class="wire" d="M154 260 L290 226"/><path class="wire" d="M154 260 L290 280"/><path class="wire" d="M154 260 L290 334"/><rect class="box" x="30" y="312" width="124" height="36" rx="2"/><text x="42" y="335" font-size="13">an editor</text><path class="wire" d="M154 330 L290 172"/><path class="wire" d="M154 330 L290 226"/><path class="wire" d="M154 330 L290 280"/><path class="wire" d="M154 330 L290 334"/><rect class="box" x="290" y="154" width="120" height="36" rx="2"/><text x="302" y="177" font-size="13">GitHub</text><rect class="box" x="290" y="208" width="120" height="36" rx="2"/><text x="302" y="231" font-size="13">a database</text><rect class="box" x="290" y="262" width="120" height="36" rx="2"/><text x="302" y="285" font-size="13">a browser</text><rect class="box" x="290" y="316" width="120" height="36" rx="2"/><text x="302" y="339" font-size="13">your files</text><text class="mono small clay" x="30" y="392">12 pieces of glue</text><rect class="box" x="470" y="172" width="124" height="36" rx="2"/><text x="482" y="191" font-size="13">a coding agent</text><text class="mono small faint" x="482" y="204">client</text><path class="wire" d="M594 190 H636"/><rect class="box" x="470" y="242" width="124" height="36" rx="2"/><text x="482" y="261" font-size="13">a chat app</text><text class="mono small faint" x="482" y="274">client</text><path class="wire" d="M594 260 H636"/><rect class="box" x="470" y="312" width="124" height="36" rx="2"/><text x="482" y="331" font-size="13">an editor</text><text class="mono small faint" x="482" y="344">client</text><path class="wire" d="M594 330 H636"/><rect x="636" y="150" width="26" height="206" rx="3" fill="var(--soft)" stroke="var(--clay)"/><text class="mono small clay" x="649" y="258" text-anchor="middle" transform="rotate(-90 649 253)">MCP</text><path class="wire" d="M662 172 H714"/><rect class="box" x="714" y="154" width="136" height="36" rx="2"/><text x="726" y="173" font-size="13">GitHub</text><text class="mono small faint" x="726" y="186">server</text><path class="wire" d="M662 226 H714"/><rect class="box" x="714" y="208" width="136" height="36" rx="2"/><text x="726" y="227" font-size="13">a database</text><text class="mono small faint" x="726" y="240">server</text><path class="wire" d="M662 280 H714"/><rect class="box" x="714" y="262" width="136" height="36" rx="2"/><text x="726" y="281" font-size="13">a browser</text><text class="mono small faint" x="726" y="294">server</text><path class="wire" d="M662 334 H714"/><rect class="box" x="714" y="316" width="136" height="36" rx="2"/><text x="726" y="335" font-size="13">your files</text><text class="mono small faint" x="726" y="348">server</text><text class="mono small clay" x="470" y="392">3 clients + 4 servers</text>
<text class="small muted" x="30" y="432">A service writes its server once, and every agent with a client can use it.</text>
