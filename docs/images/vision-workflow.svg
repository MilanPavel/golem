<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" role="img" aria-label="Dependency upgrades as a workflow: a schedule on Monday at 06:00, list the outdated packages with plain code, upgrade them with five sub-agents, a review by you, and open the pull requests once. A checkpoint is saved after every step. The daemon dies after step 3, comes back, and resumes without running anything twice. The review waits two days until it is approved on the iPhone, and four pull requests are opened exactly once.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="456" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">A WORKFLOW</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">durable</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">it waits for you, and acts once</text>
<text class="mono label" x="30" y="152" text-anchor="start">STEPS · YOUR CODE PUTS THEM IN ORDER</text><rect class="box" x="30" y="172" width="120" height="70" rx="6"/><text class="mono small" x="44" y="202" text-anchor="start">mon 06:00</text><text class="small faint" x="44" y="224" text-anchor="start">schedule</text><rect x="84.0" y="292" width="12" height="12" rx="2" fill="none" stroke="var(--line)"/><rect class="box" x="190" y="172" width="130" height="70" rx="6"/><text class="mono small" x="204" y="202" text-anchor="start">list outdated</text><text class="small faint" x="204" y="224" text-anchor="start">plain code</text><rect x="249.0" y="292" width="12" height="12" rx="2" fill="none" stroke="var(--line)"/><path class="wire" d="M150 207 H189"/><path class="head" d="M183 203 L190 207 L183 211 Z"/><rect class="box" x="360" y="172" width="150" height="70" rx="6"/><text class="mono small" x="374" y="202" text-anchor="start">upgrade</text><text class="small faint" x="374" y="224" text-anchor="start">5 sub-agents</text><rect x="429.0" y="292" width="12" height="12" rx="2" fill="none" stroke="var(--line)"/><path class="wire" d="M320 207 H359"/><path class="head" d="M353 203 L360 207 L353 211 Z"/><rect class="box" x="550" y="172" width="130" height="70" rx="6"/><text class="mono small" x="564" y="202" text-anchor="start">review</text><text class="small faint" x="564" y="224" text-anchor="start">you</text><rect x="609.0" y="292" width="12" height="12" rx="2" fill="none" stroke="var(--line)"/><path class="wire" d="M510 207 H549"/><path class="head" d="M543 203 L550 207 L543 211 Z"/><rect class="box" x="720" y="172" width="130" height="70" rx="6"/><text class="mono small" x="734" y="202" text-anchor="start">open PRs</text><text class="small faint" x="734" y="224" text-anchor="start">once</text><rect x="779.0" y="292" width="12" height="12" rx="2" fill="none" stroke="var(--line)"/><path class="wire" d="M680 207 H719"/><path class="head" d="M713 203 L720 207 L713 211 Z"/><path class="edge" d="M36 298 H844"/><text class="small faint" x="30" y="330" text-anchor="start">checkpoint after every step</text>
<text class="small muted" x="30" y="430">Steps call tools, models, or whole agents. The order is code, so it is the same every Monday.</text>
<g class="anim"><rect class="lit" x="26" y="168" width="128" height="78" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.1000;0.1120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="86.0" y="294" width="8" height="8" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0780;0.0900;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M150 207 H188" keyTimes="0;0.1000;0.1300;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0880;0.1000;0.1300;0.1420;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="186" y="168" width="138" height="78" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1180;0.1300;0.2200;0.2320;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="251.0" y="294" width="8" height="8" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1980;0.2100;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M320 207 H358" keyTimes="0;0.2200;0.2400;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2080;0.2200;0.2400;0.2520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="356" y="168" width="158" height="78" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2280;0.2400;0.3400;0.3520;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="374" y="230" width="0" height="4"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2400;0.3000;0.9700;1.0000" values="0;0;20;20;0"/></rect><rect class="dot" x="399" y="230" width="0" height="4"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2550;0.3120;0.9700;1.0000" values="0;0;20;20;0"/></rect><rect class="dot" x="424" y="230" width="0" height="4"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2700;0.3240;0.9700;1.0000" values="0;0;20;20;0"/></rect><rect class="dot" x="449" y="230" width="0" height="4"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2850;0.3360;0.9700;1.0000" values="0;0;20;20;0"/></rect><rect class="dot" x="474" y="230" width="0" height="4"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3000;0.3480;0.9700;1.0000" values="0;0;20;20;0"/></rect><rect class="dot" x="431.0" y="294" width="8" height="8" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3180;0.3300;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></rect><rect x="0" y="100" width="880" height="320" fill="var(--clay)" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.36;0.37;0.40;1" values="0;0;0.18;0;0"/></rect><text opacity="0" class="mono small clay" x="30" y="372" text-anchor="start">✕  the daemon dies: kill -9, a crash, an upgrade<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3580;0.3700;0.4700;0.4820;1.0000" values="0;0;1;1;0;0"/></text><text opacity="0" class="mono small clay" x="30" y="372" text-anchor="start">↻  it comes back and resumes after step 3. Nothing runs twice.<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4580;0.4700;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M510 207 H548" keyTimes="0;0.5600;0.5900;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5480;0.5600;0.5900;0.6020;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="546" y="168" width="138" height="78" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5780;0.5900;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="small clay" x="615" y="270" text-anchor="middle">waiting · 2 days<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5880;0.6000;0.7200;0.7320;1.0000" values="0;0;1;1;0;0"/></text><text opacity="0" class="small clay" x="615" y="270" text-anchor="middle">approved on iPhone<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7080;0.7200;0.8000;0.8120;1.0000" values="0;0;1;1;0;0"/></text><rect class="dot" x="611.0" y="294" width="8" height="8" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7780;0.7900;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M680 207 H718" keyTimes="0;0.8000;0.8300;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7880;0.8000;0.8300;0.8420;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="716" y="168" width="138" height="78" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8180;0.8300;0.9500;0.9620;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="781.0" y="294" width="8" height="8" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.9080;0.9200;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="small clay" x="785" y="270" text-anchor="middle">4 PRs, opened once<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8480;0.8600;0.9700;0.9820;1.0000" values="0;0;1;1;0;0"/></text></g>
</svg>
