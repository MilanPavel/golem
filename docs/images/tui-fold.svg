<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" role="img" aria-label="A screen as a fold over events. The numbered events of one session, from session.created to run.completed, go one at a time through one function that takes the state and an event and gives a new state. The state is small: the messages, whether a run is busy, a call that waits for approval, and the error and notice lines. The screen is painted from that state and thrown away. Live, replayed from the first event, or resumed after a drop, the same events give the same screen.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="490" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">IN AGENTS GENERALLY</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">fold</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">a screen is drawn from events</text>
<text class="mono label" x="30" y="140">THE EVENTS</text><text class="mono label" x="290" y="140">ONE FUNCTION</text><text class="mono label" x="470" y="140">THE STATE</text><text class="mono label" x="670" y="140">THE SCREEN</text><rect class="box" x="30" y="156" width="210" height="22" rx="2"/><text class="mono small" x="42" y="171">1 session.created</text><rect class="box" x="30" y="182" width="210" height="22" rx="2"/><text class="mono small" x="42" y="197">2 message.completed</text><rect class="box" x="30" y="208" width="210" height="22" rx="2"/><text class="mono small" x="42" y="223">3 run.started</text><rect class="box" x="30" y="234" width="210" height="22" rx="2"/><text class="mono small" x="42" y="249">4 message.started</text><rect class="box" x="30" y="260" width="210" height="22" rx="2"/><text class="mono small" x="42" y="275">5 message.delta</text><rect class="box" x="30" y="286" width="210" height="22" rx="2"/><text class="mono small" x="42" y="301">6 message.delta</text><rect class="box" x="30" y="312" width="210" height="22" rx="2"/><text class="mono small" x="42" y="327">… 190 more deltas</text><rect class="box" x="30" y="338" width="210" height="22" rx="2"/><text class="mono small" x="42" y="353">197 message.completed</text><rect class="box" x="30" y="364" width="210" height="22" rx="2"/><text class="mono small" x="42" y="379">198 run.completed</text><rect class="box" x="290" y="230" width="140" height="74" rx="2" style="fill:var(--soft)"/><text x="304" y="254" font-size="14">fold</text><text class="small faint" x="304" y="272">state + event</text><text class="small faint" x="304" y="290">→ new state</text><path class="wire" d="M240 267 H287"/><path class="head" d="M281 263 L288 267 L281 271 Z"/><rect class="box" x="470" y="156" width="160" height="226" rx="2"/><text class="mono small" x="484" y="182">messages</text><text class="small faint" x="484" y="200">id, role, text, streaming</text><text class="mono small" x="484" y="232">busy</text><text class="small faint" x="484" y="250">a run is working</text><text class="mono small" x="484" y="282">approval</text><text class="small faint" x="484" y="300">a call that waits</text><text class="mono small" x="484" y="332">error, notice</text><text class="small faint" x="484" y="350">the red and yellow lines</text><path class="wire" d="M430 267 H467"/><path class="head" d="M461 263 L468 267 L461 271 Z"/><rect class="box" x="670" y="156" width="180" height="226" rx="2"/><text class="mono small" x="684" y="184">you</text><text class="small" x="684" y="202">Tell a short story</text><text class="mono small" x="684" y="234">golem</text><text class="small" x="684" y="252">Once, a golem of</text><text class="small" x="684" y="270">river clay found a</text><text class="small" x="684" y="288">brush by the kiln…</text><path class="wire" d="M684 350 H836"/><text class="mono small faint" x="684" y="370">connected · 3 messages</text><path class="wire" d="M630 267 H667"/><path class="head" d="M661 263 L668 267 L661 271 Z"/><text class="small faint" x="470" y="400">kept</text><text class="small faint" x="670" y="400">painted again, then thrown away</text><rect class="dot" x="30" y="430" width="6" height="6"/><text x="46" y="438" font-size="14" class="muted">Live, replayed from 1, or resumed after a drop: the same events give the same screen</text><rect class="dot" x="30" y="452" width="6" height="6"/><text x="46" y="460" font-size="14" class="muted">The screen keeps the state, never the events. A late window reads them again</text>
