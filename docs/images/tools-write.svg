<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" role="img" aria-label="A file change in golem: the tool plans the new text without writing anything, the approval shows its diff, you allow that diff, and when the call runs it plans again. Only when the new plan makes the same diff is the file written. If the file changed in the meantime, the call fails and nothing is written.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="396" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE FILE CHANGE</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">1 diff</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">you approve the diff, not the call</text>
<rect class="box" x="30" y="150" width="150" height="92" rx="2"/><text class="mono label" x="44" y="174">PLAN</text><text x="44" y="202" font-size="14">the new text,</text><text x="44" y="222" font-size="14" class="muted">nothing written</text><rect class="box" x="196" y="150" width="150" height="92" rx="2"/><text class="mono label" x="210" y="174">ASK</text><text x="210" y="202" font-size="14">approval.needed</text><text x="210" y="222" font-size="14" class="muted">with the diff</text><rect class="box" x="362" y="150" width="150" height="92" rx="2"/><text class="mono label" x="376" y="174">YOU</text><text x="376" y="202" font-size="14">allow</text><text x="376" y="222" font-size="14" class="muted">this diff</text><rect class="box" x="528" y="150" width="150" height="92" rx="2"/><text class="mono label" x="542" y="174">PLAN AGAIN</text><text x="542" y="202" font-size="14">when the call runs</text><text x="542" y="222" font-size="14" class="muted">same diff?</text><path class="wire" d="M180 196 H192"/><path class="head" d="M186 192 L193 196 L186 200 Z"/><path class="wire" d="M346 196 H358"/><path class="head" d="M352 192 L359 196 L352 200 Z"/><path class="wire" d="M512 196 H524"/><path class="head" d="M518 192 L525 196 L518 200 Z"/><path class="wire" d="M678 196 H700 M700 172 V292"/><path class="wire" d="M700 172 H714"/><path class="head" d="M708 168 L715 172 L708 176 Z"/><path class="wire" d="M700 292 H714"/><path class="head" d="M708 288 L715 292 L708 296 Z"/><rect class="box" x="718" y="146" width="132" height="52" rx="2"/><text class="mono label" x="732" y="166">YES</text><text x="732" y="188" font-size="14">write it</text><rect class="box" x="718" y="266" width="132" height="52" rx="2"/><text class="mono label" x="732" y="286">NO</text><text x="732" y="308" font-size="14">tool.failed</text><rect x="196" y="262" width="316" height="58" rx="2" style="fill:var(--sunken)"/><text class="mono small faint" x="210" y="284" style="white-space:pre">-     return a + b</text><text class="mono small clay" x="210" y="306" style="white-space:pre">+     return int(a) + int(b)</text><path class="wire back" d="M271 242 V262"/><text class="small muted" x="30" y="352">The write is a temp file and a rename, in the same folder.</text><text class="small muted" x="30" y="372">If the file changed while you looked, the diff differs, and nothing is written.</text>
