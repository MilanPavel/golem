<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" role="img" aria-label="golem's shell sandbox in one real run, with every command allowed by a rule. touch notes.txt writes in the project folder and exits 0. touch in the home folder and ls ~/.ssh fail with Operation not permitted, curl cannot connect because the network is off, and printenv prints nothing because credential variables are removed.">
<style>
  :root { --bg:#F3F2EF; --surface:#FBFAF8; --ink:#1D1A17; --muted:#57524C; --faint:#6C665F;
          --line:#B9B3AA; --clay:#C4783A; --clay-ink:#94501E; --soft:#F1E2D4; --sunken:#EAE8E3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15120F; --surface:#1D1915; --ink:#EEE7DF; --muted:#B5ACA2; --faint:#8F877E;
            --line:#5A5148; --clay:#D08549; --clay-ink:#E6A06A; --soft:#2E2118; --sunken:#110E0C; }
  }
  @media (prefers-reduced-motion: reduce) { .anim { display:none } }
  text { font-family: Geist, Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; }
  .label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
  .small { font-size: 12px; }
  .faint { fill: var(--faint); }
  .muted { fill: var(--muted); }
  .clay { fill: var(--clay-ink); }
  .wire { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .head { fill: var(--line); }
  .back { stroke-dasharray: 3 3; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .lit { fill: none; stroke: var(--clay); stroke-width: 1.8; }
  .box { fill: var(--surface); }
  .dot { fill: var(--clay); }
</style>
<rect width="880" height="468" rx="12" fill="var(--bg)"/>
<text class="mono label" x="32" y="44">ONE RUN IN GOLEM</text><text class="mono" x="848" y="62" text-anchor="end" font-size="40" style="fill:var(--clay-ink)">1 of 5</text><text x="848" y="90" text-anchor="end" font-size="16" class="muted">got through: the write in the project</text>
<rect x="300" y="150" width="220" height="262" rx="3" fill="var(--soft)"/><text class="mono label" x="316" y="140">INSIDE THE SANDBOX</text><text class="mono label" x="30" y="140">FIVE COMMANDS, ONE RUN</text><text class="mono label" x="550" y="140">OUTSIDE</text><rect x="517" y="150" width="6" height="262" rx="3" style="fill:var(--clay)" opacity=".55"/><rect class="box" x="320" y="160" width="180" height="40" rx="2"/><text x="334" y="185" font-size="14">the project folder</text><rect class="box" x="30" y="160" width="250" height="40" rx="2"/><text class="mono" x="42" y="185" font-size="12">touch notes.txt</text><rect class="box" x="30" y="212" width="250" height="40" rx="2"/><text class="mono" x="42" y="237" font-size="12">touch ~/golem-sandbox-probe</text><rect class="box" x="30" y="264" width="250" height="40" rx="2"/><text class="mono" x="42" y="289" font-size="12">ls ~/.ssh</text><rect class="box" x="30" y="316" width="250" height="40" rx="2"/><text class="mono" x="42" y="341" font-size="12">curl https://example.com</text><rect class="box" x="30" y="368" width="250" height="40" rx="2"/><text class="mono" x="42" y="393" font-size="12">printenv DEMO_API_KEY</text><path class="edge" d="M280 232 H550"/><rect class="box" x="550" y="212" width="300" height="40" rx="2"/><text class="mono" x="562" y="230" font-size="12">your home, for writes</text><text class="small faint" x="562" y="245">only the folder, temp, caches</text><path class="edge" d="M280 284 H550"/><rect class="box" x="550" y="264" width="300" height="40" rx="2"/><text class="mono" x="562" y="282" font-size="12">~/.ssh, ~/.golem, keychains</text><text class="small faint" x="562" y="297">no reads</text><path class="edge" d="M280 336 H550"/><rect class="box" x="550" y="316" width="300" height="40" rx="2"/><text class="mono" x="562" y="334" font-size="12">the network</text><text class="small faint" x="562" y="349">off unless [shell] network</text><path class="edge" d="M280 388 H550"/><rect class="box" x="550" y="368" width="300" height="40" rx="2"/><text class="mono" x="562" y="386" font-size="12">*_API_KEY, *_TOKEN, …</text><text class="small faint" x="562" y="401">removed from the environment</text><path class="edge" d="M280 180 H320"/>
<g class="anim"><rect class="lit" x="26" y="156" width="258" height="48" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0180;0.0300;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 180 H318" keyTimes="0;0.0400;0.0800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0280;0.0400;0.0800;0.0920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="lit" x="316" y="156" width="188" height="48" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0680;0.0800;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></rect><text opacity="0" class="mono small clay" x="30" y="446">→ exit 0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0680;0.0800;0.2000;0.2120;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="26" y="208" width="258" height="48" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2080;0.2200;0.3900;0.4020;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 232 H514" keyTimes="0;0.2300;0.2900;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2180;0.2300;0.2900;0.3020;1.0000" values="0;0;1;1;0;0"/></rect><text class="mono clay" x="520" y="239" text-anchor="middle" font-size="22" opacity="0">×<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2780;0.2900;0.3900;0.4020;1.0000" values="0;0;1;1;0;0"/></text><text opacity="0" class="mono small clay" x="30" y="446">→ Operation not permitted · exit 1<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.2580;0.2700;0.3900;0.4020;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="26" y="260" width="258" height="48" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3980;0.4100;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 284 H514" keyTimes="0;0.4200;0.4800;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4080;0.4200;0.4800;0.4920;1.0000" values="0;0;1;1;0;0"/></rect><text class="mono clay" x="520" y="291" text-anchor="middle" font-size="22" opacity="0">×<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4680;0.4800;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></text><text opacity="0" class="mono small clay" x="30" y="446">→ Operation not permitted · exit 1<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4480;0.4600;0.5800;0.5920;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="26" y="312" width="258" height="48" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5880;0.6000;0.7700;0.7820;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 336 H514" keyTimes="0;0.6100;0.6700;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5980;0.6100;0.6700;0.6820;1.0000" values="0;0;1;1;0;0"/></rect><text class="mono clay" x="520" y="343" text-anchor="middle" font-size="22" opacity="0">×<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6580;0.6700;0.7700;0.7820;1.0000" values="0;0;1;1;0;0"/></text><text opacity="0" class="mono small clay" x="30" y="446">→ Couldn't connect to server · exit 7<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6380;0.6500;0.7700;0.7820;1.0000" values="0;0;1;1;0;0"/></text><rect class="lit" x="26" y="364" width="258" height="48" rx="5" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7780;0.7900;0.9600;0.9720;1.0000" values="0;0;1;1;0;0"/></rect><rect class="dot" x="-5.0" y="-5.0" width="10" height="10" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M280 388 H514" keyTimes="0;0.8000;0.8600;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.7880;0.8000;0.8600;0.8720;1.0000" values="0;0;1;1;0;0"/></rect><text class="mono clay" x="520" y="395" text-anchor="middle" font-size="22" opacity="0">×<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8480;0.8600;0.9600;0.9720;1.0000" values="0;0;1;1;0;0"/></text><text opacity="0" class="mono small clay" x="30" y="446">→ nothing printed · exit 1<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.8280;0.8400;0.9600;0.9720;1.0000" values="0;0;1;1;0;0"/></text></g>
