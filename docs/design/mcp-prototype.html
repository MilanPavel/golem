<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golem MCP Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500&display=swap">
<style>
/* Settings → MCP servers and Config file, drawn with the tokens of docs/design/web.md.
   Light theme "slip", dark theme "kiln", one accent: clay. No colour is added for MCP. */
:root {
  --bg: #F3F2EF; --surface: #FBFAF8; --sunken: #EAE8E3; --ink: #1D1A17; --muted: #57524C; --faint: #6C665F;
  --line: #DEDAD3; --line-strong: #C9C3BA; --clay: #C4783A; --clay-ink: #94501E; --clay-soft: #F1E2D4; --slip: #ECE3D8;
  --golem-body: #9C6B3C; --golem-eye: #2A1408;
  --allow: #3F7342; --allow-soft: #DFEBDD; --deny: #A8402F; --deny-soft: #F4DED9; --wait: #8A600E; --wait-soft: #F3E7C9;
  --code-bg: #EFEDE9;
  --shadow: 0 1px 0 rgba(29,26,23,.04), 0 8px 24px -12px rgba(29,26,23,.18);
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-prose: "Literata", Georgia, serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --sidebar: 268px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120F; --surface: #1D1915; --sunken: #110E0C; --ink: #EEE7DF; --muted: #B5ACA2; --faint: #8F877E;
    --line: #2C2621; --line-strong: #3B332C; --clay: #D08549; --clay-ink: #E6A06A; --clay-soft: #2E2118; --slip: #2A221B;
    --golem-body: #A8733F; --golem-eye: #0E0704; --allow: #86B57F; --allow-soft: #1F2B1E; --deny: #E58474; --deny-soft: #33201C;
    --wait: #E2B655; --wait-soft: #30271A; --code-bg: #191512;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15120F; --surface: #1D1915; --sunken: #110E0C; --ink: #EEE7DF; --muted: #B5ACA2; --faint: #8F877E;
  --line: #2C2621; --line-strong: #3B332C; --clay: #D08549; --clay-ink: #E6A06A; --clay-soft: #2E2118; --slip: #2A221B;
  --golem-body: #A8733F; --golem-eye: #0E0704; --allow: #86B57F; --allow-soft: #1F2B1E; --deny: #E58474; --deny-soft: #33201C;
  --wait: #E2B655; --wait-soft: #30271A; --code-bg: #191512;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; border-radius: var(--r-sm); }
kbd { font: 500 11px/1 var(--font-mono); color: var(--muted); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--surface); }
.mono { font-family: var(--font-mono); }
.faint { color: var(--faint); } .muted { color: var(--muted); }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
.sidebar { background: var(--sunken); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px 10px; gap: 10px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.brand .word { font: 600 17px/1 var(--font-ui); letter-spacing: -.03em; }
.brand .st { margin-left: auto; font: 500 11px/1 var(--font-mono); color: var(--muted); }
.golem { width: 27px; height: 18px; }
.golem .b { fill: var(--golem-body); } .golem .e { fill: var(--golem-eye); }
.new-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; }
.new-btn kbd { margin-left: auto; }
.search { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r-md); color: var(--faint); font-size: 13px; }
.search kbd { margin-left: auto; }
.sessions { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.group h3 { margin: 0 0 4px; padding: 0 10px; font: 500 11px/1.6 var(--font-mono); color: var(--faint); }
.sess { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r-md); color: var(--muted); }
.sess .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess .ago { font: 11px/1 var(--font-mono); color: var(--faint); }
.sq { width: 8px; height: 8px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--line-strong); justify-self: center; }
.sq.run { background: var(--allow); box-shadow: none; }
.sq.wait { background: var(--wait); box-shadow: none; }
.sq.fail { background: var(--deny); box-shadow: none; }
.sq.start { background: var(--clay); box-shadow: none; animation: pulse 1.6s ease-in-out infinite; }
.sq.demand { box-shadow: inset 0 0 0 1.5px var(--faint); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .sq.start, .spin { animation: none !important; } }
.foot { display: flex; align-items: center; gap: 8px; padding: 6px; font: 11px/1 var(--font-mono); color: var(--faint); }
.foot .conn { display: flex; align-items: center; gap: 6px; }
.foot .conn i { width: 7px; height: 7px; border-radius: 2px; background: var(--allow); }
.foot .sp { flex: 1; }
.icon-btn { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--line); color: var(--ink); }
.icon-btn.on { background: var(--surface); color: var(--clay-ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- settings ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px 0; }
.top h1 { margin: 0; font: 600 15px/1 var(--font-ui); }
.top .x { margin-left: auto; }
.tabs { display: flex; gap: 2px; padding: 12px 20px 0; border-bottom: 1px solid var(--line); }
.tab { padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--clay); }
.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0,1fr); }
.list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.list-head { display: flex; gap: 8px; padding: 12px; }
.list-scroll { flex: 1; overflow: auto; padding: 0 8px 12px; }
.list h3 { margin: 14px 10px 4px; font: 500 11px/1.6 var(--font-mono); color: var(--faint); }
.row { width: 100%; text-align: left; display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 4px 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-md); }
.row:hover { background: var(--line); }
.row[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.row .n { font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
.row .n small { font: 11px/1 var(--font-mono); color: var(--faint); font-weight: 400; }
.row .f { grid-column: 2; font: 12px/1.3 var(--font-mono); color: var(--muted); }
.row .f.bad { color: var(--deny); } .row .f.attn { color: var(--wait); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; }
.btn:hover { border-color: var(--clay); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.clay { background: var(--clay); color: #fff; border-color: var(--clay); } :root[data-theme="dark"] .btn.clay { color: #1b0f06; }
.btn.danger { color: var(--deny); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--line); color: var(--ink); }

.detail { overflow: auto; padding: 22px 28px 40px; min-width: 0; }
.dcol { max-width: 46rem; }
.dhead { display: flex; align-items: flex-start; gap: 12px; }
.dhead h2 { margin: 0; font: 600 20px/1.2 var(--font-ui); letter-spacing: -.01em; }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1 var(--font-mono); color: var(--muted); padding-top: 6px; }
.meta { margin: 6px 0 0; font: 12.5px/1.5 var(--font-mono); color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); margin: 16px 0 0; border: 1px solid var(--line); }
.banner.bad { background: var(--deny-soft); border-color: transparent; }
.banner.warn { background: var(--wait-soft); border-color: transparent; }
.banner.ok { background: var(--allow-soft); border-color: transparent; }
.banner b { font-weight: 600; } .banner .grow { flex: 1; } .banner .why { font: 12px/1.5 var(--font-mono); color: var(--muted); margin-top: 2px; }
.banner .mk { font: 600 13px/1.4 var(--font-mono); }
.banner.bad .mk { color: var(--deny); } .banner.warn .mk { color: var(--wait); } .banner.ok .mk { color: var(--allow); }
.dtabs { display: flex; gap: 2px; margin: 22px 0 0; border-bottom: 1px solid var(--line); }
.dtabs .tab { padding: 8px 10px; }
.sub { display: flex; align-items: baseline; gap: 10px; margin: 16px 0 8px; }
.sub h4 { margin: 0; font-weight: 600; } .sub .c { font: 12px/1 var(--font-mono); color: var(--muted); }
.sub .r { margin-left: auto; }
.field-search { width: 100%; padding: 8px 10px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); }
.tools { margin-top: 8px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.tool { display: grid; grid-template-columns: 38px minmax(0,1fr) auto 24px; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.tool:first-child { border-top: 0; }
.tool .nm { font: 500 13px/1.3 var(--font-mono); } .tool .ds { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .tk { font: 12px/1 var(--font-mono); color: var(--faint); }
.tool.off .nm, .tool.off .ds { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.tool .go { color: var(--faint); border-radius: var(--r-sm); padding: 2px 6px; } .tool .go:hover { background: var(--line); color: var(--ink); }
.sw { width: 30px; height: 18px; border-radius: 9px; background: var(--line-strong); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sw[aria-checked="true"] { background: var(--clay); } .sw[aria-checked="true"]::after { transform: translateX(12px); }
.kv { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 4px 14px; margin: 8px 0 0; font-size: 13.5px; }
.kv dt { color: var(--muted); padding-top: 7px; } .kv dd { margin: 0; }
.fld { margin: 0 0 14px; } .fld label { display: block; font-weight: 500; margin-bottom: 4px; } .fld .help { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.in { width: 100%; padding: 8px 10px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); }
.in.mono { font: 13px/1.4 var(--font-mono); }
.in:focus { outline: 2px solid var(--clay); outline-offset: 0; }
.badge { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1 var(--font-mono); padding: 3px 7px; border-radius: 999px; background: var(--allow-soft); color: var(--allow); }
.badge.n { background: var(--line); color: var(--muted); } .badge.c { background: var(--clay-soft); color: var(--clay-ink); } .badge.w { background: var(--wait-soft); color: var(--wait); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.seg button { padding: 6px 12px; } .seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.code { background: var(--code-bg); border-radius: var(--r-md); padding: 10px 12px; font: 12.5px/1.6 var(--font-mono); white-space: pre-wrap; overflow: auto; }
.log { background: var(--code-bg); border-radius: var(--r-md); padding: 10px 0; font: 12.5px/1.65 var(--font-mono); max-height: 300px; overflow: auto; }
.log div { padding: 0 12px; display: grid; grid-template-columns: 70px 58px minmax(0,1fr); gap: 8px; }
.log .g { color: var(--muted); } .log .e { color: var(--ink); } .log .t { color: var(--faint); }
.result { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.result > .h { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--line); font: 12px/1.6 var(--font-mono); color: var(--muted); }
.result .code { border-radius: 0; }
.ok-t { color: var(--allow); } .bad-t { color: var(--deny); } .warn-t { color: var(--wait); }

/* ---------- dialogs ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20,14,8,.45); display: grid; place-items: center; padding: 24px; z-index: 20; }
.dialog { width: min(720px, 100%); max-height: calc(100vh - 48px); overflow: auto; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow), 0 0 0 1px var(--line); display: flex; flex-direction: column; }
.dialog.sm { width: min(520px, 100%); }
.dhd { display: flex; align-items: center; gap: 10px; padding: 16px 20px 8px; }
.dhd h2 { margin: 0; font: 600 16px/1.2 var(--font-ui); } .dhd .x { margin-left: auto; }
.dbody { padding: 8px 20px 18px; } .dft { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--bg); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.dft .sp { flex: 1; } .dft .note { color: var(--muted); font-size: 12.5px; }
.steps { display: flex; gap: 6px; align-items: center; padding: 0 20px 6px; font: 500 12px/1 var(--font-mono); color: var(--faint); }
.steps b { color: var(--ink); font-weight: 600; } .steps i { font-style: normal; }
.cat { margin: 14px 0 6px; font: 500 11px/1.6 var(--font-mono); color: var(--faint); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.card { text-align: left; padding: 11px 12px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--bg); display: flex; flex-direction: column; gap: 3px; min-height: 84px; }
.card:hover { border-color: var(--clay); } .card .t { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.card .d { color: var(--muted); font-size: 12.5px; line-height: 1.35; } .card .fact { margin-top: auto; font: 11px/1 var(--font-mono); color: var(--faint); }
.card[aria-disabled="true"] { opacity: .6; cursor: default; } .card[aria-disabled="true"]:hover { border-color: var(--line-strong); }
.tsteps { display: flex; flex-direction: column; margin: 6px 0 0; }
.ts { display: grid; grid-template-columns: 22px minmax(0,1fr) auto auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: center; }
.ts:first-child { border-top: 0; } .ts .m { font: 600 14px/1 var(--font-mono); text-align: center; }
.ts .d { color: var(--muted); font: 12.5px/1 var(--font-mono); } .ts .tm { font: 12px/1 var(--font-mono); color: var(--faint); min-width: 44px; text-align: right; }
.ts.run .m { color: var(--clay); animation: pulse 1.2s ease-in-out infinite; } .ts.ok .m { color: var(--allow); } .ts.bad .m { color: var(--deny); } .ts.todo { color: var(--faint); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; } .bar > i { display: block; height: 100%; background: var(--clay); width: 0; transition: width .2s; }
.sum { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; margin: 10px 0; font-size: 13.5px; } .sum dt { color: var(--muted); } .sum dd { margin: 0; }
.imp { margin-top: 6px; } .imp .grp { margin: 14px 0 4px; font: 500 11px/1.6 var(--font-mono); color: var(--faint); }
.irow { display: grid; grid-template-columns: 24px 170px minmax(0,1fr); gap: 10px; align-items: center; padding: 7px 4px; border-top: 1px solid var(--line); }
.irow:first-of-type { border-top: 0; } .irow .what { color: var(--muted); font: 12.5px/1.4 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.irow .in { padding: 4px 8px; } .irow input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--clay); }
.irow .note { grid-column: 3; font-size: 12px; color: var(--muted); margin-top: -4px; } .irow.dim { opacity: .7; }

/* ---------- config editor ---------- */
.cfg { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 28px 20px; gap: 12px; }
.cfg-head { display: flex; align-items: center; gap: 10px; max-width: 62rem; width: 100%; margin: 0 auto; }
.cfg-head .path { font: 12.5px/1 var(--font-mono); color: var(--muted); }
.cfg-head .sp { flex: 1; }
.editor { position: relative; flex: 1; min-height: 240px; max-width: 62rem; width: 100%; margin: 0 auto; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); overflow: hidden; display: grid; grid-template-columns: 56px minmax(0,1fr); }
.gutter { background: var(--sunken); color: var(--faint); font: 12.5px/22px var(--font-mono); padding: 10px 0; text-align: right; user-select: none; overflow: hidden; border-right: 1px solid var(--line); }
.gutter div { padding: 0 8px 0 0; height: 22px; position: relative; } .gutter .er { color: var(--deny); font-weight: 600; background: var(--deny-soft); } .gutter .er::before { content: "✗"; position: absolute; left: 7px; }
.gutter .lk::before { content: "🔒︎"; position: absolute; left: 6px; font-size: 10px; filter: grayscale(1); opacity: .7; }
.stack { position: relative; overflow: auto; }
.stack pre, .stack textarea { margin: 0; padding: 10px 14px; font: 12.5px/22px var(--font-mono); white-space: pre; tab-size: 2; border: 0; min-height: 100%; }
.stack pre { position: absolute; inset: 0; pointer-events: none; color: var(--ink); }
.stack textarea { position: relative; width: 100%; height: 100%; min-height: 100%; background: transparent; color: transparent; caret-color: var(--clay); resize: none; outline: none; overflow: hidden; display: block; }
.tk-c { color: var(--faint); font-style: italic; } .tk-h { color: var(--clay-ink); font-weight: 500; } .tk-k { color: var(--ink); } .tk-s { color: var(--allow); } .tk-n { color: var(--wait); }
.ln-er { background: var(--deny-soft); display: inline-block; width: 100%; } .ln-lk { background: var(--sunken); display: inline-block; width: 100%; }
.lock-note { color: var(--faint); font-family: var(--font-ui); font-style: normal; margin-left: 12px; }
.problems { max-width: 62rem; width: 100%; margin: 0 auto; font: 12.5px/1.6 var(--font-mono); }
.problems .p { display: flex; gap: 10px; padding: 3px 0; cursor: pointer; } .problems .p b { color: var(--deny); font-weight: 600; } .problems .okline { color: var(--allow); }
.diff { font: 12.5px/1.6 var(--font-mono); background: var(--bg); border-radius: var(--r-md); overflow: auto; max-height: 300px; }
.diff div { padding: 0 12px; white-space: pre; } .diff .a { background: var(--allow-soft); } .diff .d { background: var(--deny-soft); } .diff .h { background: var(--sunken); color: var(--faint); }

/* ---------- chat behind the settings (shown only in "chat" state) ---------- */
.proto { position: fixed; right: 14px; bottom: 14px; z-index: 40; background: #1b1713; color: #eee7df; border-radius: 12px; padding: 10px 12px; font: 12px/1.4 var(--font-ui); display: flex; flex-direction: column; gap: 6px; max-width: 440px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
.proto b { font: 500 10.5px/1 var(--font-mono); color: #a89f94; letter-spacing: .04em; }
.proto .rowp { display: flex; flex-wrap: wrap; gap: 4px; }
.proto button { padding: 4px 8px; border-radius: 6px; background: #2b251f; color: #eee7df; font-size: 12px; } .proto button[aria-pressed="true"] { background: #c4783a; color: #1b0f06; }
body.shot .proto { display: none; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r-md); z-index: 50; font-size: 13px; box-shadow: var(--shadow); }
.spin { display: inline-block; width: 9px; height: 9px; background: var(--clay); border-radius: 2px; animation: pulse 1.2s ease-in-out infinite; }
@media (max-width: 1100px) { .panes { grid-template-columns: 1fr; } .list { display: none; } .panes.show-list .list { display: flex; } .panes.show-list .detail { display: none; } }
@media (max-width: 760px) { .app { grid-template-columns: 0 minmax(0,1fr); } .sidebar { display: none; } .cards { grid-template-columns: 1fr 1fr; } }

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const FAST = location.hash.includes("shot");

  /* the pixel golem, as in prototype.html */
  const GRID = ["...bbb...", "..bdbdb..", "bbbbbbbbb", "b.bbbbb.b", "b.bbbbb.b", "..bb.bb.."];
  $$("[data-golem]").forEach(svg => {
    svg.setAttribute("viewBox", "0 0 9 6"); svg.setAttribute("shape-rendering", "crispEdges");
    GRID.forEach((row, y) => [...row].forEach((c, x) => { if (c === ".") return;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", 1.02); r.setAttribute("height", 1.02);
      r.setAttribute("class", c === "d" ? "e" : "b"); svg.appendChild(r); }));
  });

  /* ---------- data ---------- */
  const TOOLS = [
    ["get_me", "Profile of the signed-in user", 120], ["list_issues", "List issues in a repository", 410],
    ["create_issue", "Open an issue", 360], ["create_pull_request", "Open a pull request from a branch", 640],
    ["search_code", "Search code across repositories", 330], ["get_file_contents", "Read a file or a folder", 290],
    ["create_gist", "Create a gist", 380], ["delete_file", "Delete a file in a repository", 250],
    ["list_commits", "List the commits of a branch", 270], ["merge_pull_request", "Merge a pull request", 310],
  ].map(([n, d, t], i) => ({ n, d, t, on: ![6, 7].includes(i) }));
  const S = {
    tab: "mcp", sel: "github", dtab: "tools", filter: "", dialog: null, toolSel: "list_issues", ran: false, follow: true,
    servers: [
      { id: "filesystem", st: "run", word: "running", fact: "14 tools · 2.1k tokens", where: "user", addr: "npx -y @modelcontextprotocol/server-filesystem ~/repos/golem" },
      { id: "github", st: "run", word: "running", fact: "29 tools · 4.1k tokens", where: "user", addr: "https://api.githubcopilot.com/mcp/" },
      { id: "memory", st: "demand", word: "on demand", fact: "9 tools · off in this chat", where: "user", addr: "npx -y @modelcontextprotocol/server-memory" },
      { id: "linear", st: "wait", word: "needs sign-in", fact: "sign in to start", where: "user", addr: "https://mcp.linear.app/mcp" },
      { id: "docs-search", st: "fail", word: "failed", fact: "retry in 12 s", where: "project", addr: "npx -y @acme/docs-mcp", err: "command not found: npx" },
    ],
    cfg: null, cfgText: "", cfgErrors: [], cfgState: "edit", cfgSaved: false,
  };
  const CFG0 = `# golem's settings. Edit here, or in a terminal.
default_model = "claude-sonnet-5-5"

[mcp.github]
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer keychain:mcp/github" }
enabled = true
timeout_seconds = 120

[mcp.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]
enabled = "on_demand"

[shell]
network = false
writable = ["~/repos"]

[[rule]]
tool = "mcp__github__get_*"
action = "allow"
`;
  const CATALOG = [
    ["Files", [["filesystem", "Filesystem", "Read and write files in a folder", "no sign-in", "form"], ["git", "Git", "History and diffs of a repo", "uses uv", "form"]]],
    ["Code", [["github", "GitHub", "Repos, issues, pull requests", "needs a token", "token", "added"], ["sentry", "Sentry", "Errors and releases", "sign in", "oauth"], ["context7", "Context7", "Up-to-date library docs", "no sign-in", "run"]]],
    ["Web", [["fetch", "Fetch", "Read any web page", "no sign-in", "run", "added"], ["playwright", "Playwright", "Browse and test web pages", "installs Node", "node"], ["brave", "Brave Search", "Web search", "needs a token", "token"]]],
  ];
  const srv = id => S.servers.find(s => s.id === id);
  const dot = s => `<i class="sq ${s.st === "run" ? "run" : s.st === "fail" ? "fail" : s.st === "wait" ? "wait" : s.st === "start" ? "start" : "demand"}"></i>`;

  const toast = t => { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2200); };

  /* ---------- render: settings ---------- */
  function render() {
    $("#main").innerHTML = `
      <div class="top"><h1>Settings</h1><button class="icon-btn x" data-a="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="${S.tab === "mcp"}" data-tab="mcp">MCP servers</button>
        <button class="tab" role="tab" aria-selected="${S.tab === "cfg"}" data-tab="cfg">Config file</button>
      </div>
      ${S.tab === "mcp" ? mcpView() : cfgView()}`;
    if (S.tab === "cfg") bindEditor();
    $("#layer").innerHTML = S.dialog ? dialogView() : "";
  }

  function mcpView() {
    const group = w => S.servers.filter(s => s.where === w).map(s => `
      <button class="row" data-sel="${s.id}" aria-current="${S.sel === s.id}">${dot(s)}
        <span class="n">${esc(s.id)}<small>${esc(s.word)}</small></span>
        <span class="f ${s.st === "fail" ? "bad" : s.st === "wait" ? "attn" : ""}">${esc(s.fact)}</span></button>`).join("");
    return `<div class="panes">
      <div class="list">
        <div class="list-head"><button class="btn primary" data-a="add">＋ Add a server</button><button class="btn" data-a="import">Import</button></div>
        <div class="list-scroll"><h3>Yours</h3>${group("user")}<h3>This project · ~/repos/golem</h3>${group("project")}</div>
      </div>
      <div class="detail"><div class="dcol">${detailView(srv(S.sel))}</div></div></div>`;
  }

  function detailView(s) {
    if (!s) return "";
    const failed = s.st === "fail", wait = s.st === "wait", demand = s.st === "demand";
    const banner = failed ? `<div class="banner bad"><span class="mk">✗</span><div class="grow"><b>Node is missing. golem can install it.</b><div class="why">${esc(s.err)} · trying again in 12 s</div></div><button class="btn clay sm" data-a="installnode">Install Node</button></div>`
      : wait ? `<div class="banner warn"><span class="mk">!</span><div class="grow"><b>Linear needs you to sign in.</b><div class="why">It opens linear.app in a new tab. golem keeps the token in the Keychain.</div></div><button class="btn clay sm" data-a="signin">Sign in</button></div>` : "";
    const actions = failed ? `<button class="btn" data-a="testsrv">Find out why</button><button class="btn" data-dtab="logs">Logs</button><button class="btn" data-dtab="edit">Edit</button><button class="btn ghost" data-a="menu">⋯</button>`
      : `<button class="btn" data-a="testsrv">Test</button><button class="btn" data-dtab="logs">Logs</button><button class="btn" data-a="reconnect">Reconnect</button>${demand ? `<button class="btn" data-a="turnon">Turn on in this chat</button>` : s.st === "run" ? `<button class="btn" data-a="turnoff">Turn off in this chat</button>` : ""}<button class="btn ghost" data-a="menu" aria-haspopup="menu">⋯</button>`;
    const body = S.dtab === "tools" ? toolsView(s) : S.dtab === "try" ? tryView(s) : S.dtab === "logs" ? logsView(s) : editView(s);
    return `<div class="dhead"><h2>${esc(s.id)}</h2><span class="status">${dot(s)}${esc(s.word)}</span></div>
      <p class="meta">${esc(s.addr)}<br>${s.where === "user" ? "Yours · ~/.golem/config.toml" : "This project · ~/repos/golem/.golem/config.toml"}</p>
      ${banner}<div class="actions">${actions}</div>
      <div class="dtabs" role="tablist">${[["tools", "Tools"], ["try", "Try a tool"], ["logs", "Logs"], ["edit", "Edit"]].map(([k, l]) => `<button class="tab" role="tab" aria-selected="${S.dtab === k}" data-dtab="${k}">${l}</button>`).join("")}</div>
      ${body}`;
  }

  const tokTotal = () => TOOLS.filter(t => t.on).reduce((a, t) => a + t.t, 0);
  function toolsView(s) {
    if (s.id !== "github") return `<p class="muted" style="margin-top:18px">${s.st === "fail" ? "Tools show here once the server runs." : "Tools of this server show here."}</p>`;
    const rows = TOOLS.filter(t => t.n.includes(S.filter)).map(t => `<div class="tool ${t.on ? "" : "off"}">
      <button class="sw" role="switch" aria-checked="${t.on}" aria-label="${t.on ? "Hide" : "Show"} ${t.n}" data-tool="${t.n}"></button>
      <div><div class="nm">${t.n}</div><div class="ds">${esc(t.d)}</div></div>
      <span class="tk">${t.on ? t.t : "hidden"}</span><button class="go" data-try="${t.n}" aria-label="Try ${t.n}">▸</button></div>`).join("");
    return `<div class="sub"><h4>Tools</h4><span class="c">${29 + TOOLS.filter(t => t.on).length - 8} of 41 on · about ${(4.1 + (tokTotal() - 2730) / 1000).toFixed(1)}k tokens a turn</span></div>
      <input class="field-search" placeholder="Search tools" value="${esc(S.filter)}" data-filter aria-label="Search tools"><div class="tools">${rows}</div>
      <p class="muted" style="font-size:12.5px;margin-top:10px">Asks before every call · token stored in the Keychain · hidden tools never reach the model.</p>`;
  }

  function tryView(s) {
    const t = TOOLS.find(x => x.n === S.toolSel) || TOOLS[1];
    return `<div class="sub"><h4>Try a tool</h4><span class="c">called as you, not recorded in a chat</span></div>
      <div class="fld"><label for="tsel">Tool</label><select class="in" id="tsel" data-toolsel>${TOOLS.map(x => `<option ${x.n === t.n ? "selected" : ""}>${x.n}</option>`).join("")}</select><div class="help">${esc(t.d)}.</div></div>
      <div class="fld"><label>owner <span class="faint">required</span></label><input class="in mono" value="MilanPavel"></div>
      <div class="fld"><label>repo <span class="faint">required</span></label><input class="in mono" value="golem"></div>
      <div class="fld"><label>state</label><div class="seg" role="group" aria-label="state"><button aria-pressed="true">open</button><button aria-pressed="false">closed</button><button aria-pressed="false">all</button></div></div>
      <div class="fld"><label>per_page</label><input class="in mono" value="30" style="max-width:120px"><div class="help">1 to 100. <a href="#" data-a="json" style="color:var(--clay-ink)">Edit as JSON</a></div></div>
      <div style="display:flex;gap:10px;align-items:center"><button class="btn primary" data-a="run">Run</button><span class="muted" style="font-size:12.5px">Calls it once. golem doesn't ask, because you pressed Run.</span></div>
      ${S.ran ? `<div class="result"><div class="h"><span class="ok-t">✓ ${esc(t.n)}</span><span>0.6 s</span></div><div class="code">[
  { "number": 482, "title": "1.12.3 ADR and design: MCP from anywhere", "state": "open" },
  { "number": 483, "title": "1.12.4 Every MCP setting over RPC", "state": "open" }
]</div></div>` : ""}`;
  }

  function logsView(s) {
    const L = s.st === "fail" ? [["14:20:01", "golem", "starting"], ["14:20:01", "golem", "failed: command not found: npx"], ["14:20:02", "golem", "retry in 1 s"], ["14:20:03", "golem", "starting"], ["14:20:03", "golem", "failed: command not found: npx"], ["14:20:05", "golem", "retry in 2 s"]]
      : [["14:02:11", "golem", "starting"], ["14:02:12", "golem", "running (41 tools)"], ["14:07:40", "golem", "ping failed, retry in 1 s"], ["14:07:41", "golem", "starting"], ["14:07:42", "golem", "running (41 tools)"], ["14:21:03", "stderr", "rate limit: 4 requests left, resets 14:30"]];
    return `<div class="sub"><h4>Logs</h4><span class="c">${S.follow ? "following" : "paused"}</span><span class="r"><label style="font-size:13px;margin-right:10px"><input type="checkbox" ${S.follow ? "checked" : ""} data-follow style="accent-color:var(--clay)"> Follow</label><button class="btn sm" data-a="copylog">Copy</button></span></div>
      <div class="log" role="log" aria-label="Logs of ${esc(s.id)}">${L.map(([t, k, x]) => `<div><span class="t">${t}</span><span class="${k === "golem" ? "g" : "e"}">${k}</span><span class="${k === "golem" ? "g" : "e"}">${esc(x)}</span></div>`).join("")}</div>`;
  }

  function editView(s) {
    const http = s.addr.startsWith("http");
    return `<div class="sub"><h4>Edit</h4><span class="c">one update, and the server restarts</span><span class="r"><button class="btn sm ghost" data-a="astext">Open as text</button></span></div>
      <div class="fld"><label>${http ? "Address" : "Command line"}</label><input class="in mono" value="${esc(s.addr)}">${http ? `<div class="help">Changing this means pasting the token again.</div>` : ""}</div>
      ${http ? `<div class="fld"><label>Token</label><div style="display:flex;gap:10px;align-items:center"><span class="badge">✓ stored in the Keychain</span><button class="btn sm" data-a="replace">Replace token</button></div><div class="help">Never shown. Left empty, it keeps the one you have.</div></div>` : ""}
      <div class="fld"><label>Runs</label><div class="seg" role="group" aria-label="Runs"><button aria-pressed="false">Always on</button><button aria-pressed="${s.st !== "fail"}">On demand</button><button aria-pressed="false">Off</button></div></div>
      <div class="fld"><label>Asks</label><div class="seg" role="group" aria-label="Asks"><button aria-pressed="true">Before every call</button><button aria-pressed="false">Never</button></div><div class="help">“Never” runs this server's tools without an approval card.</div></div>
      <div class="fld" style="max-width:160px"><label>Timeout (s)</label><input class="in mono" value="120"></div>
      <div style="display:flex;gap:8px"><button class="btn primary" data-a="saveedit">Save</button><button class="btn ghost" data-dtab="tools">Cancel</button></div>`;
  }

  /* ---------- render: config editor ---------- */
  function highlight(text, errLines, lockLines) {
    return text.split("\n").map((l, i) => {
      let h = esc(l).replace(/^(\s*)(#.*)$/, '$1<span class="tk-c">$2</span>');
      if (!/tk-c/.test(h)) {
        h = h.replace(/^(\s*\[+[^\]]+\]+)/, '<span class="tk-h">$1</span>')
          .replace(/^(\s*[A-Za-z_][\w.-]*)(\s*=)/, '<span class="tk-k">$1</span>$2')
          .replace(/(&quot;[^&]*?&quot;)/g, '<span class="tk-s">$1</span>')
          .replace(/(= )(\d+|true|false)\b/g, '$1<span class="tk-n">$2</span>');
      }
      if (lockLines.has(i + 1) && /^\s*\[/.test(l)) h += '<span class="lock-note">locked: edit this in a terminal</span>';
      const cls = errLines.has(i + 1) ? "ln-er" : lockLines.has(i + 1) ? "ln-lk" : "";
      return cls ? `<span class="${cls}">${h || " "}</span>` : h;
    }).join("\n") + "\n";
  }
  const PROTECTED = ["shell", "web", "providers", "trusted_projects"];
  function check(text) {
    const errs = [];
    const lines = text.split("\n");
    let section = "";
    lines.forEach((l, i) => {
      const t = l.trim();
      if (!t || t.startsWith("#")) return;
      const h = /^\[\[?([^\]]+)\]\]?$/.exec(t);
      if (h) { section = h[1].split(".")[0]; return; }
      if (!/^[A-Za-z_][\w.-]*\s*=/.test(t)) errs.push({ line: i + 1, message: 'expected "=" after a key' });
      const m = /^timeout_seconds\s*=\s*(\d+)/.exec(t);
      if (m && +m[1] > 3600) errs.push({ line: i + 1, path: "mcp.github.timeout_seconds", message: "must be at most 3600" });
    });
    // a change inside a protected part is refused, and the part says so
    const parts = txt => { const m = {}; let sec = null, hdr = 0; txt.split("\n").forEach((l, i) => { const h = /^\[\[?([^\]]+)\]\]?$/.exec(l.trim()); if (h) { sec = PROTECTED.includes(h[1].split(".")[0]) ? h[1] : null; if (sec) { m[sec] = { head: i + 1, lines: [] }; } return; } if (sec && l.trim()) m[sec].lines.push([i + 1, l]); }); return m; };
    const was = parts(CFG0), now = parts(text);
    Object.keys({ ...was, ...now }).forEach(k => {
      const a = (was[k]?.lines || []).map(x => x[1]), b = now[k]?.lines || [];
      const bad = b.filter(([, l]) => !a.includes(l)).map(([n]) => n);
      if (bad.length) bad.forEach(n => errs.push({ line: n, message: "this part stays in the terminal (golem config edit)" }));
      else if (a.length !== b.length) errs.push({ line: now[k]?.head || 1, message: "this part stays in the terminal (golem config edit)" });
    });
    return errs;
  }
  function lockSet() { const s = new Set(); let sec = ""; CFG0.split("\n").forEach((l, i) => { const h = /^\[\[?([^\]]+)\]\]?$/.exec(l.trim()); if (h) { sec = h[1].split(".")[0]; if (PROTECTED.includes(sec)) s.add(i + 1); } }); return s; }

  function cfgView() {
    if (S.cfg === null) { S.cfg = CFG0; if (!S.cfgText) S.cfgText = CFG0; S.cfgErrors = check(S.cfgText); }
    const errLines = new Set(S.cfgErrors.map(e => e.line)); const locks = lockSet();
    const n = S.cfgText.split("\n").length;
    const dirty = S.cfgText !== S.cfg;
    return `<div class="cfg">
      <div class="cfg-head"><div class="seg" role="group" aria-label="Which file"><button aria-pressed="true">User</button><button aria-pressed="false">This project</button></div>
        <span class="path">~/.golem/config.toml</span><span class="sp"></span>
        ${S.cfgSaved ? `<span class="badge">✓ saved</span>` : ""}<button class="btn" data-a="revert" ${dirty ? "" : "disabled"}>Revert</button><button class="btn primary" data-a="savecfg" ${dirty && !S.cfgErrors.length ? "" : "disabled"}>Save…</button></div>
      ${S.cfgState === "conflict" ? `<div class="banner warn" style="max-width:62rem;width:100%;margin:0 auto"><span class="mk">!</span><div class="grow"><b>config.toml changed on disk while you were editing.</b><div class="why">Another window or program saved first. Reload keeps your text in a draft you can copy.</div></div><button class="btn sm" data-a="reload">Reload</button><button class="btn sm" data-a="overwrite">Overwrite</button></div>` : ""}

  function diffDialog() {
    const a = S.cfg.split("\n"), b = S.cfgText.split("\n"); const out = [];
    // line diff by longest common subsequence, small files
    const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    let i = 0, j = 0; const ops = [];
    while (i < n && j < m) { if (a[i] === b[j]) { ops.push([" ", a[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) ops.push(["-", a[i++]]); else ops.push(["+", b[j++]]); }
    while (i < n) ops.push(["-", a[i++]]); while (j < m) ops.push(["+", b[j++]]);
    const idx = ops.map((o, k) => o[0] !== " " ? k : -1).filter(k => k >= 0);
    const keep = new Set(); idx.forEach(k => { for (let x = k - 2; x <= k + 2; x++) keep.add(x); });
    let last = -2;
    ops.forEach((o, k) => { if (!keep.has(k)) return; if (k !== last + 1) out.push(`<div class="h">@@ line ${k + 1} @@</div>`); last = k; out.push(`<div class="${o[0] === "+" ? "a" : o[0] === "-" ? "d" : ""}">${o[0]} ${esc(o[1])}</div>`); });
    return dlg("Save these changes?", "", `<div class="diff">${out.join("")}</div>`, `<span class="note">The servers reload when it is saved.</span><span class="sp"></span><button class="btn" data-a="closedlg">Cancel</button><button class="btn primary" data-a="dosave">Save</button>`, "sm");
  }
