# Roles and helpers

[[case]]
name = "a title on a local session uses the session's model"
session_model = "local-32k"
models = ["local-32k", "budget-128k"]
action = "title_role"
[case.expect]
model = "ollama/qwen3:27b"
reason = "session is local"

[[case]]
name = "a title on a hosted session uses the cheapest budget model"
session_model = "frontier-200k"
models = ["local-32k", "budget-128k", "budget-other", "frontier-200k"]
action = "title_role"
[case.expect]
model = "deepseek/deepseek-chat"
reason = "cheapest budget model"

[[case]]
name = "a title on a hosted session with no budget model uses the session's model"
session_model = "frontier-200k"
models = ["frontier-200k"]
action = "title_role"
[case.expect]
model = "anthropic/opus"
reason = "no budget model ready"

[[case]]
name = "a title in a local-only folder with no local model falls to the session's model"
session_model = "frontier-200k"
models = ["budget-128k", "frontier-200k"]
action = "title_role"
local_only_folder = true
[case.expect]
model = "anthropic/opus"
reason = "no local model"

[[case]]
name = "a title takes the model the settings name"
session_model = "local-32k"
models = ["local-32k", "budget-128k"]
action = "title_role"
[case.settings.routing.roles]
titles = "deepseek/deepseek-chat"
[case.expect]
model = "deepseek/deepseek-chat"
reason = "configured"

[[case]]
name = "a helper in a local-only session stays on the local model"
session_model = "local-32k"
models = ["local-32k", "frontier-200k"]
action = "helper_role"
local_only_folder = true
[case.settings.routing.roles]
explore = "anthropic/opus"
[case.expect]
model = "ollama/qwen3:27b"
reason = "session is local"

[[case]]
name = "a helper that the settings send to a hosted model, outside a local-only folder"
session_model = "local-32k"
models = ["local-32k", "frontier-200k"]
action = "helper_role"
[case.settings.routing.roles]
explore = "anthropic/opus"
[case.expect]
model = "anthropic/opus"
reason = "configured"
