# Local models golem suggests downloading. The only model list kept by hand.
#
# Every entry is meant to call tools. The registry does not say so for newer
# models, so an installed model's tool support comes from Ollama instead.
# size_gb is the download size from the Ollama registry manifest (the sum of
# its layers). Installed models need no entry here: golem finds them through Ollama.

[[model]]
ref = "ollama/llama3.2:3b"
label = "Llama 3.2 3B"
size_gb = 2.0
tags = ["small"]

