# The models golem suggests, and the only model list kept by hand.
#
# [[local]] entries are models to download with Ollama. [[hosted]] entries are
# the current models of the six hosted providers: golem offers one when the
# provider's live list has it too. A ref you type always works, entry or not.
# categories come from a fixed set: general, coding, reasoning, vision, fast,
# long-context. A hosted ref is "provider/model", and each one has a price
# entry in litellm-prices.json, so golem knows its context size.
#
# [[local]]: every entry is meant to call tools. The registry does not say so for newer
# models, so an installed model's tool support comes from Ollama instead.
# size_gb is the download size from the Ollama registry manifest (the sum of
# its layers). Installed models need no entry here: golem finds them through Ollama.
# min_ram_gb is the memory a Mac needs for the model to run well. Of the
# entries tagged "starter", golem recommends the largest one this Mac has the
# memory for, so a first download stays small and quick.

[[local]]
ref = "ollama/llama3.2:3b"
label = "Llama 3.2 3B"
size_gb = 2.0
min_ram_gb = 8
tags = ["starter", "small"]

