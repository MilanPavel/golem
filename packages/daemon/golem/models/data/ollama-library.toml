# The Ollama library names golem knows, so a search needs no network.
# Ollama has no search API, so this list ships with golem, as catalog.toml does.
# `just catalog` refreshes each size and reports tags that are gone. It never adds
# a name: which models appear here stays a human choice.
# Chat models only, no embedding models. size_gb is the download size from the
# registry manifest (the sum of its layers).

