[[ask]]
name = "one-hard-question"
text = "why does check_sum in verify.py return a wrong total for an empty list, and what is the right fix?"
facts = ["empty", "start|initial|default|zero|0"]
size = "little"
reason = "model"
read_tokens = 1200
hard = true

[ask.files]
"verify.py" = "def check_sum(values):\n    total = values[0]\n    for value in values[1:]:\n        total += value\n    return total\n"

