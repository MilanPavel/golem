# The servers `mcp.catalog` offers. One [[entry]] each. `template` is a partial
# [mcp.<name>] table: a string may hold {folder} (the session's folder),
# {name} (the server's name), {input.<id>} (a typed value), and {secret.<id>}
# (a secret input, which becomes keychain:mcp/<name>). `just catalog` checks it.

[[entry]]
id = "filesystem"
name = "filesystem"
title = "Filesystem"
description = "Read and write files in a folder."
category = "files"
homepage = "https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem"
runtime = "npx"
auth = "none"
[entry.template]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "{input.folder}"]
[[entry.inputs]]
id = "folder"
kind = "path"
label = "Folder"
hint = "The server can read and write everything inside it."
default = "{folder}"

[[entry]]
id = "fetch"
name = "fetch"
title = "Fetch"
description = "Read web pages as text."
category = "web"
homepage = "https://github.com/modelcontextprotocol/servers/tree/main/src/fetch"
runtime = "uvx"
auth = "none"
starter = true
[entry.template]
command = "uvx"
args = ["mcp-server-fetch"]

[[entry]]
id = "git"
name = "git"
title = "Git"
description = "Read a repository's history and status, and commit."
category = "code"
homepage = "https://github.com/modelcontextprotocol/servers/tree/main/src/git"
runtime = "uvx"
auth = "none"
[entry.template]
command = "uvx"
args = ["mcp-server-git", "--repository", "{input.repo}"]
[[entry.inputs]]
id = "repo"
kind = "path"
label = "Repository"
hint = "The folder that holds the .git folder."
default = "{folder}"

[[entry]]
id = "time"
name = "time"
title = "Time"
description = "The current time, and conversion between time zones."
category = "other"
homepage = "https://github.com/modelcontextprotocol/servers/tree/main/src/time"
runtime = "uvx"
auth = "none"
[entry.template]
command = "uvx"
args = ["mcp-server-time"]

[[entry]]
id = "memory"
name = "memory"
title = "Memory"
description = "A small knowledge graph that remembers facts between chats."
category = "productivity"
homepage = "https://github.com/modelcontextprotocol/servers/tree/main/src/memory"
runtime = "npx"
auth = "none"
[entry.template]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[[entry]]
id = "sequential-thinking"
name = "sequential-thinking"
title = "Sequential thinking"
description = "A scratchpad for working through a problem in steps."
category = "other"
homepage = "https://github.com/modelcontextprotocol/servers/tree/main/src/sequentialthinking"
runtime = "npx"
auth = "none"
[entry.template]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[[entry]]
id = "github"
name = "github"
title = "GitHub"
description = "Repos, issues, and pull requests."
category = "code"
homepage = "https://github.com/github/github-mcp-server"
runtime = "url"
auth = "token"
[entry.template]
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer {secret.token}" }
[[entry.inputs]]
id = "token"
kind = "secret"
label = "GitHub token"
hint = "Make a token at github.com/settings/personal-access-tokens/new: pick the repos under Repository access, then add Contents, Issues, and Pull requests."

[[entry]]
id = "playwright"
name = "playwright"
title = "Playwright"
description = "Drive a web browser: open pages, click, and read what is on them."
category = "web"
homepage = "https://github.com/microsoft/playwright-mcp"
runtime = "npx"
auth = "none"
starter = true
[entry.template]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[[entry]]
id = "context7"
name = "context7"
title = "Context7"
description = "Current documentation for libraries and frameworks."
category = "code"
homepage = "https://github.com/upstash/context7"
runtime = "url"
auth = "none"
starter = true
[entry.template]
url = "https://mcp.context7.com/mcp"

[[entry]]
id = "brave-search"
name = "brave-search"
title = "Brave Search"
description = "Search the web with Brave."
category = "web"
homepage = "https://github.com/brave/brave-search-mcp-server"
runtime = "npx"
auth = "token"
[entry.template]
command = "npx"
args = ["-y", "@brave/brave-search-mcp-server"]
env = { BRAVE_API_KEY = "{secret.token}" }
[[entry.inputs]]
id = "token"
kind = "secret"
label = "Brave API key"
hint = "Make a key at brave.com/search/api."
