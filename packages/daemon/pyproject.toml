[project]
name = "golem"
version = "0.0.0"
description = "Golem daemon."
requires-python = ">=3.12"
dependencies = [
  "golem-protocol",
  "langchain-anthropic>=1.7.5",
  "langchain-core>=1.6.7",
  "langchain-openai>=1.6.7",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.10",
  "pydantic-settings>=2.10",
]

[tool.uv.sources]
golem-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golem"]
