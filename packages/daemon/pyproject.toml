[project]
name = "golem"
version = "0.0.0"
description = "Golem daemon."
requires-python = ">=3.12"
dependencies = [
  "golem-protocol",
  "pydantic>=2.10",
  "pydantic-settings>=2.10",
]

[tool.uv.sources]
golem-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golem"]
