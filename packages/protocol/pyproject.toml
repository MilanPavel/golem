[project]
name = "golem-protocol"
version = "0.0.0"
description = "Protocol models for golem. Source of truth for JSON Schema and TypeScript."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golem_protocol"]
